# netlify.toml — config Netlify : dossier des fonctions + routage /api/*

[build]
  # Site statique : pas de commande de build. Netlify lance `npm install` tout seul
  # parce qu'il voit le package.json (pour la dépendance @netlify/blobs).
  publish = "."
  functions = "netlify/functions"

# ── Pipeline santé existant (inchangé, sert de repli) ──
[[redirects]]
  from = "/api/health/ingest"
  to = "/.netlify/functions/health-ingest"
  status = 200

[[redirects]]
  from = "/api/health/latest"
  to = "/.netlify/functions/health-latest"
  status = 200

# ── Hub intervals.icu ──
# Sync : déclenchée à l'ouverture de l'app (front) + appelable par URL. Non planifiée.
[[redirects]]
  from = "/api/intervals-sync"
  to = "/.netlify/functions/intervals-sync"
  status = 200

# Lecteur branche CHARGE (ACWR / monotonie / derive) consomme par « Suivi data ».
[[redirects]]
  from = "/api/load"
  to = "/.netlify/functions/load"
  status = 200

# Lecteur branche RECUP (sommeil / FC repos / HRV) — future source de la branche Recup.
[[redirects]]
  from = "/api/wellness"
  to = "/.netlify/functions/wellness"
  status = 200
