<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching Triathlon 2026</title>
<meta name="theme-color" content="#0b0b0d">
<style>
@font-face{font-family:Urbanist;src:url(assets/fonts/Urbanist-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Doto;src:url(assets/fonts/Doto-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* ── Tri Coach Dark — tokens (design system « Tri Coach Dark », étape 1) ── */
:root{
  color-scheme:dark;
  --graphite-0:#f2f2f4; --graphite-100:#e8e8ea; --graphite-200:#c4c5ca; --graphite-300:#9a9ba1; --graphite-400:#8a8b91; --graphite-500:#5c5d63;
  --graphite-600:#3a3b40; --graphite-700:#2a2b30; --graphite-800:#1e1f23; --graphite-850:#17181b; --graphite-900:#111214; --graphite-950:#0b0b0d;
  --bg-page:var(--graphite-950); --surface-card:var(--graphite-850); --surface-raised:var(--graphite-800); --surface-sunken:var(--graphite-900);
  --surface-sheen:rgba(255,255,255,.06); --border-subtle:rgba(255,255,255,.07); --border-default:var(--graphite-700);
  --text-strong:var(--graphite-0); --text-primary:var(--graphite-100); --text-secondary:var(--graphite-300); --text-muted:var(--graphite-400); --text-disabled:var(--graphite-500);
  --chart-idle:var(--graphite-600); --chart-track:var(--graphite-700);
  --action-500:#f2d23d; --action-400:#f7e06a; --action-ink:#1a1600;
  --state-ok:#3fd9a0; --state-warn:#ff9f43; --state-danger:#ff5a5f; --state-none:var(--graphite-400);
  --state-ok-bg:rgba(63,217,160,.12); --state-warn-bg:rgba(255,159,67,.12); --state-danger-bg:rgba(255,90,95,.12);
  --ambiance-prune-light:#c38fd0; --ambiance-prune-mid:#8e4da8; --ambiance-prune-deep:#5a2a78; --ambiance-prune-ink:#3e1d57;
  --ambiance-indigo-core:#06071a; --ambiance-indigo-mid:#2b2a6e; --ambiance-indigo-edge:#5a58a8;
  --text-on-ambiance:#fff; --text-on-ambiance-muted:rgba(255,255,255,.8);
  --font-sans:Urbanist,system-ui,-apple-system,sans-serif; --font-dot:Doto,ui-monospace,monospace;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:18px; --radius-xl:22px; --radius-pill:999px;
  --shadow-focus:0 0 0 2px #f2d23d; --shadow-sheet:0 -12px 32px rgba(0,0,0,.5);
  --shadow-indigo-glow:inset 0 0 60px 14px rgba(90,88,168,.95),inset 0 0 18px 3px rgba(150,145,230,.55);
  --shadow-action-ring:inset 0 0 0 1px rgba(242,210,61,.6); --shadow-action-ring-hover:inset 0 0 0 1.5px #f7e06a;
  --size-control:44px; --size-control-sm:36px; --size-touch-min:44px; --size-column:440px;
  --stroke-chart:1.5px; --chart-dot:4px; --chart-dot-gap:5px; --chart-skew:-14deg; --chart-gap:6px;

  /* ── Alias de l'ancien thème (étape 1 : l'app passe en sombre sans toucher aux composants) ── */
  --ink:var(--text-strong); --ink-surface:var(--graphite-700);
  --slate:var(--graphite-300); --lime:var(--action-500); --lime-deep:var(--action-400);
  --canvas:var(--bg-page); --card:var(--surface-card); --card-alt:var(--surface-raised);
  --border-divider:rgba(255,255,255,.06); --track:var(--chart-track); --data-neutral:var(--graphite-600);
  --on-dark-muted:var(--graphite-300); --track-dark:var(--graphite-700);
  --swim:#5e7ca6; --bike:#6b9a72; --run:#c08457; --ppg:#8878a8;
  --ok:var(--state-ok); --warn:var(--state-warn); --danger:var(--state-danger);
  --font-display:var(--font-sans); --font-body:var(--font-sans);
  --r-sm:var(--radius-sm); --r-md:var(--radius-md); --r-lg:var(--radius-lg); --r-pill:var(--radius-pill);
  --shadow-card:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;font-family:var(--font-body)}
a{color:var(--text-secondary);text-decoration:none}
code{font-family:ui-monospace,monospace;font-size:.9em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.shell{min-height:100vh;display:flex;justify-content:center;background:var(--canvas)}
.col{width:100%;max-width:440px;min-height:100vh;background:transparent;position:relative;padding-bottom:104px}
.screen{padding:20px 16px 8px}
.hidden{display:none!important}

.h1{font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--text-primary)}
.h-card{font-weight:800;font-size:15px;color:var(--text-primary)}
.eyebrow{font-size:12px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}
.sub{font-size:13px;color:var(--text-secondary);line-height:1.5}
.prio{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:var(--r-pill);font-size:11px;font-weight:700;vertical-align:1px}
.prio.cle{background:var(--text-strong);color:var(--bg-page)}.prio.facultative{background:var(--card-alt);color:var(--text-secondary)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}.daychips button{flex:1;min-width:38px;padding:9px 0;border-radius:var(--r-sm);border:1px solid var(--border-subtle);background:var(--card);font-weight:700;font-size:13px;color:var(--text-secondary);cursor:pointer}
.daychips button.on{background:var(--ink-surface);border-color:var(--ink-surface);color:#fff}
.slotnote{font-size:12.5px;color:var(--text-secondary);margin-top:8px;line-height:1.45}
.flash{display:flex;gap:10px;align-items:flex-start;background:var(--ink-surface);color:#fff;border-radius:var(--r-md);padding:13px 14px;margin-bottom:16px;font-size:14px;line-height:1.45;font-weight:600}
.flash span{flex:1}.flash button{border:0;background:transparent;color:var(--on-dark-muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.pausec .pt{font-size:17px;font-weight:800;margin-top:6px}
.modal-back.sheetback{align-items:flex-end;padding:0}.sheet{background:var(--canvas);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(0,0,0,0.60)}
.sopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.sopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:13px 14px;cursor:pointer}
.sopt b{font-size:15px;color:var(--text-primary)}.sopt span{font-size:13px;color:var(--text-secondary)}
.imp-btn{width:100%;margin-top:10px;background:transparent!important;border:1px dashed var(--slate)!important;color:var(--slate)!important}
.effort{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.effort button{padding:10px 0;border-radius:10px;border:1px solid var(--border-subtle);background:var(--card);font-weight:700;font-size:14px;color:var(--text-secondary);cursor:pointer}
.effort button.hi{border-color:rgba(255,90,95,0.35)}.effort button.on{background:var(--ink-surface);border-color:var(--ink-surface);color:#fff}
.adjnote{background:rgba(255,255,255,0.064);border:1px solid rgba(255,255,255,0.176);border-radius:var(--r-md);padding:13px 14px;font-size:14px;line-height:1.45;color:var(--text-primary)}.adjnote b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:3px}
.abadge.dropped{opacity:.55}.abadge.dropped .at{text-decoration:line-through}.st-dropped{background:var(--card-alt);color:var(--text-muted)}
.prio.adj{background:rgba(255,255,255,0.096);color:var(--slate)}
.dtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-pill);margin-right:4px;vertical-align:1px}
.dtag.mes{background:rgba(107,154,114,.16);color:var(--state-ok)}.dtag.dec{background:rgba(192,132,87,.16);color:var(--state-warn)}.dtag.int{background:rgba(255,255,255,0.112);color:var(--slate)}
.bl{font-size:14px;line-height:1.5;color:var(--text-secondary);margin-top:10px}
.brows{margin-top:14px;border-top:1px solid var(--border-divider)}.brow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--border-divider);font-size:13.5px;cursor:pointer}
.brow .bd{width:30px;font-weight:700;color:var(--text-muted)}.brow .bn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .bs{color:var(--text-secondary);white-space:nowrap}
.bdot{width:9px;height:9px;border-radius:50%;flex:none}.bdot.done{background:var(--ok)}.bdot.z2{background:var(--warn)}.bdot.missed{background:var(--danger)}.bdot.dropped{background:var(--data-neutral)}.bdot.todo{background:transparent;border:1.5px solid var(--text-disabled)}
.decision{margin-top:16px;background:var(--card-alt);border-radius:var(--r-md);padding:14px}.decision .dl{font-size:17px;font-weight:800;margin:4px 0 4px}.dok{margin-top:10px;font-weight:800;color:var(--state-ok)}
.evo{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-divider)}.evo .et{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}.evo .et b{font-size:22px}.evo .ex{font-size:13px;color:var(--text-secondary);line-height:1.45;margin-top:4px}
.adjr{padding:12px 0;border-top:1px solid var(--border-divider)}.adjr:first-of-type{border-top:0}.adjr .aw{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}.adjr .aw span{color:var(--text-muted);font-weight:600;white-space:nowrap}.adjr .am{font-size:13.5px;color:var(--text-secondary);line-height:1.45;margin:4px 0 8px}
.cta.sm{height:36px;font-size:13px;flex:none;padding:0 14px;width:auto;display:inline-flex}
.reperes summary{font-weight:800;font-size:15px;cursor:pointer}

/* cartes */
.card{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px}
.card+.card{margin-top:14px}

/* section header ligne */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sechead h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sechead a{font-size:13px;font-weight:600;color:var(--text-secondary)}
.row{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:13px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card);cursor:pointer;position:relative}
.row.is-done{background:var(--surface-raised)}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.chip svg{width:20px;height:20px}
.chip .badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:2px solid var(--card)}
.chip .badge svg{width:10px;height:10px;stroke:#fff}

/* pastilles statut */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:5px 11px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.st-todo{border:1px solid var(--border-subtle);color:var(--text-secondary);background:var(--card)}
.st-done{background:rgba(63,217,160,0.14);color:var(--state-ok)}
.st-missed{background:rgba(255,90,95,0.12);color:var(--state-danger)}
.st-adapt{background:rgba(255,255,255,0.08);color:var(--ink)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;border:1px solid transparent;min-height:48px}
.btn.primary{background:var(--surface-raised);color:var(--action-500);border-color:transparent;box-shadow:var(--shadow-action-ring)!important;box-shadow:0 14px 30px -18px rgba(242,210,61,0.7)}
.btn.secondary{background:var(--card);color:var(--text-primary);border-color:var(--border-subtle)}

.btn.block{width:100%}


/* segmented */
.seg{display:flex;background:var(--card);border:1px solid var(--border-subtle);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:10px;font-size:15px;font-weight:700;color:var(--text-secondary);cursor:pointer}
.seg button.on{background:var(--ink-surface);color:#fff}

/* pills semaine -> grille */
.pills{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:4px}
.pills button{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--border-subtle);background:var(--card);color:var(--text-secondary);font-weight:700;font-size:14px;cursor:pointer;display:grid;place-items:center}
.pills button.on{border-color:var(--text-strong);background:var(--text-strong);color:var(--bg-page);font-weight:800}

/* activity badge (calendrier) */
.abadge{position:relative;background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:13px;display:flex;align-items:center;gap:13px;cursor:pointer}
.abadge.is-done{background:var(--surface-raised)}
.abadge .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.abadge .ai svg{width:20px;height:20px}
.abadge .ai .badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:2px solid var(--card)}
.abadge .ai .badge svg{width:10px;height:10px;stroke:#fff}
.abadge .ab{flex:1;min-width:0}
.abadge .at{font-size:15px;font-weight:700}
.abadge .as{font-size:13px;color:var(--text-secondary);margin-top:2px}
.day-rest{padding:14px 4px;font-size:15px;color:var(--text-muted);font-weight:500}

/* liste semaines */
.wk{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow-card);cursor:pointer}
.wk .n{font-size:15px;font-weight:800}
.wk .b{font-size:12px;color:var(--text-secondary);margin-top:2px}
.wk .dots{display:flex;gap:5px;margin-top:8px}
.wk .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.wk .cnt{font-size:14px;font-weight:800;color:var(--text-muted);white-space:nowrap}
.wk.cur{border-color:rgba(242,210,61,0.7);box-shadow:0 8px 20px -14px rgba(0,0,0,0.50),inset 0 0 0 1px rgba(242,210,61,0.5)}

/* menu rows */
.menu{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mrow{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:15px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card);cursor:pointer}
.mrow .mi{width:34px;height:34px;border-radius:10px;background:var(--card-alt);display:grid;place-items:center;flex:none;color:var(--ink)}
.mrow .mi svg{width:18px;height:18px}
.mrow .ml{flex:1;font-size:15px;font-weight:700;color:var(--text-primary)}
.mrow .mc{color:var(--text-muted);display:flex}
.mrow .mc svg{width:18px;height:18px}
.mrow.danger .mi{background:rgba(255,90,95,0.1);color:var(--danger)}
.mrow.danger .ml{color:var(--danger)}

/* champs */
.field{width:100%;background:var(--card-alt);border:1px solid var(--border-subtle);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--text-primary)}
.field::placeholder{color:var(--text-muted)}
.flabel{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:7px}

/* détail (overlay) */
.ovl{position:fixed;inset:0;background:var(--canvas);z-index:100;overflow-y:auto;max-width:440px;margin:0 auto}
.ohead{background:var(--ink-surface);padding:18px 18px 22px;color:#fff;border-radius:0 0 22px 22px}
.oback{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);display:grid;place-items:center;cursor:pointer;color:#fff}
.oback svg{width:20px;height:20px}
.o-eyebrow{font-size:13px;color:var(--on-dark-muted);margin-top:16px}
.o-title{font-weight:800;font-size:24px;margin-top:4px;letter-spacing:-.01em}
.o-facts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.o-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.o-pill svg{width:15px;height:15px}
.o-pill.done{background:rgba(63,217,160,0.24);color:var(--state-ok-bg)}
.o-note{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:15px;font-size:15px;color:var(--text-secondary);line-height:1.5;box-shadow:var(--shadow-card);border-left:3px solid var(--lime)}
.step{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:14px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow-card)}
.step .n{width:28px;height:28px;flex:none;border-radius:9px;background:var(--ink-surface);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.step .st h4{font-size:15px;font-weight:700}
.step .st p{font-size:14px;color:var(--text-secondary);margin-top:3px;line-height:1.45}
.cta-lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:0 2px 8px}
.cta-row{display:flex;gap:12px}
.cta{flex:1;height:54px;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:0}
.cta svg{width:18px;height:18px}
.cta.ghost{background:var(--card);color:var(--text-secondary);border:1px solid var(--border-subtle)}
.cta.done.sel{background:var(--ok);color:#fff}

.cta.adapt.sel{background:var(--ink-surface);color:#fff}
.ring{position:relative;flex:none}
.ring .rl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--text-primary)}

/* ppg */
.ppg{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px;display:flex;gap:14px;align-items:flex-start}
.ppg .pi{width:104px;height:104px;border-radius:14px;overflow:hidden;background:var(--graphite-700);border:1px solid var(--border-subtle);display:grid;place-items:center;flex:none;color:var(--ppg);position:relative}
.ppg .pi svg{width:30px;height:30px;opacity:.7}
.ppg .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ppg .pc{flex:1;min-width:0}
.ppg .ptop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px}
.ppg .ptop strong{font-size:16px;font-weight:800;flex-basis:100%}
.ppg .tag{font-size:12px;font-weight:700;color:var(--ppg);background:rgba(136,120,168,.14);padding:4px 10px;border-radius:99px;white-space:nowrap}
.ppg .pm{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:3px}
.ppg .pcue{font-size:13px;color:var(--text-secondary);line-height:1.45}
.tgt{margin-top:7px;font-size:12.5px;font-weight:700;color:var(--ink);background:rgba(255,255,255,0.06);border-radius:8px;padding:5px 9px;display:inline-block;line-height:1.4}

/* nav basse */
.navwrap{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:60}
.nav{width:100%;max-width:410px;pointer-events:auto;display:flex;justify-content:space-around;align-items:center;background:var(--ink-surface);border-radius:22px;padding:8px;box-shadow:0 22px 44px -20px rgba(0,0,0,0.70)}
.nav button{flex:1;border:0;background:transparent;color:var(--graphite-400);height:46px;border-radius:16px;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.nav button.on{background:var(--graphite-700);color:var(--text-strong)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:360px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,0.65)}
.modal-t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.modal-m{font-size:16px;font-weight:600;margin-top:8px;line-height:1.4}
.modal-row{display:flex;gap:12px;margin-top:20px}
.modal-row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ═══ Gélule routine (déclencheur dans le détail natation) ═══ */
.rt-open{width:100%;text-align:left;background:var(--card);border:1px solid var(--border-subtle);border-left:3px solid var(--swim);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;font-family:inherit}
.rt-open .ic{width:40px;height:40px;flex:none;border-radius:11px;background:rgba(94,124,166,.12);display:grid;place-items:center;color:var(--swim)}
.rt-open .ic svg{width:22px;height:22px}
.rt-open .tx{flex:1}
.rt-open .tx h4{margin:0;font-size:15px;font-weight:800;color:var(--text-primary)}
.rt-open .tx p{margin:3px 0 0;font-size:13px;color:var(--text-secondary)}
.rt-open .chev{color:var(--text-muted)}
.rt-open .chev svg{width:20px;height:20px}

/* ═══ Overlay routine (carrousel) ═══ */
.rovl{position:fixed;inset:0;background:var(--canvas);z-index:120;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
.rhead{background:var(--ink-surface);padding:16px 18px;color:#fff;border-radius:0 0 20px 20px;flex:none}
.rhead .top{display:flex;align-items:center;justify-content:space-between}
.rhead .ttl{font-size:13px;color:var(--on-dark-muted);font-weight:600}
.rhead .eb{font-size:13px;color:var(--on-dark-muted);margin-top:12px}
.rprog{height:4px;background:var(--track-dark);border-radius:99px;margin-top:12px;overflow:hidden}
.rprog>i{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;transition:width .28s ease}
.rvp{flex:1;overflow:hidden;position:relative}
.rtrack{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.rslide{min-width:100%;height:100%;overflow-y:auto;padding:18px 16px 22px;-webkit-overflow-scrolling:touch}
.rcard{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.reb{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--danger);text-transform:uppercase}
/* cover / note / list */
.rcover,.rnote{padding:26px 22px}
.rcover{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.rcover .reb,.rnote .reb{text-align:center;display:block}
.rcover h2{margin:10px 0 0;font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.01em;font-family:var(--font-display)}
.rcover hr,.rnote hr,.rlist hr{border:0;border-top:1px solid var(--border-divider);margin:18px 0}
.rcover .row{display:flex;gap:12px;justify-content:center;align-items:baseline;margin-top:12px;font-size:16px}
.rcover .row .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.rnote h3,.rlist h3{margin:8px 0 0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-align:center;font-family:var(--font-display)}
.rnote .it{font-size:15.5px;line-height:1.55;color:var(--text-secondary);margin:0 0 15px;text-align:center}
.rnote .it:last-child{margin-bottom:0}
.rnote .it b{color:var(--text-primary);font-weight:800}
.rnote.left .it{text-align:left}
.rlist{padding:24px 22px}
.rlist ul{list-style:none;margin:0;padding:0}
.rlist li{font-size:15.5px;line-height:1.5;color:var(--text-secondary);text-align:center;padding:11px 0;border-bottom:1px solid var(--border-divider)}
.rlist li:last-child{border-bottom:0}
.rlist .cp{margin-top:16px;padding-top:16px;border-top:1px solid var(--border-divider);text-align:center}
.rlist .cp .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase}
.rlist .cp .v{margin-top:6px;font-size:15px;font-weight:700;color:var(--text-primary)}
/* exercise */
.rex{overflow:hidden}
.rex .hd{padding:20px 22px 0}
.rex h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em;font-family:var(--font-display)}
.rex .img{margin:16px 0 0;background:#fff;border-top:1px solid var(--border-divider);border-bottom:1px solid var(--border-divider)}
.rex .img img{display:block;width:100%;height:auto}
.rex .ex{padding:18px 22px 0}
.rex .ex .lbl{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--text-muted);text-transform:uppercase}
.rex .ex p{margin:9px 0 0;font-size:15.5px;line-height:1.5;color:var(--text-secondary)}
.rex .ft{display:flex;margin:20px 0 0;border-top:1px solid var(--border-divider)}
.rex .ft>div{flex:1;padding:15px 22px 20px}
.rex .ft>div+div{border-left:1px solid var(--border-divider)}
.rex .ft .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase}
.rex .ft .v{margin-top:5px;font-size:15px;font-weight:700;color:var(--text-primary)}
/* nav */
.rnav{flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--canvas);border-top:1px solid var(--border-subtle)}
.rnav button{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--border-subtle);background:var(--card);color:var(--text-primary);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-card)}
.rnav button svg{width:22px;height:22px}
.rnav button[disabled]{opacity:.35;box-shadow:none;cursor:default}
.rdots{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.rdots .d{width:7px;height:7px;border-radius:50%;background:var(--data-neutral);cursor:pointer;transition:all .2s;border:1px solid var(--graphite-600)}
.rdots .d.on{background:var(--swim);border-color:var(--swim);width:22px;border-radius:99px}

/* ════ Design system Tri Coach Dark — composants (copie de components/bundle.css) ════ */
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.tc-cap{font-size:12px;color:var(--text-muted)}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}

/* Icône */
.tc-icon{display:inline-block;vertical-align:middle;flex:none;color:inherit}
[data-icon]{display:inline-flex;line-height:0}

/* Bouton */
.tc-btn{appearance:none;border:0;margin:0;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--size-control);padding:0 var(--space-5);border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:15px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background-color .15s,transform .1s}
.tc-btn:active{transform:scale(.98)}
.tc-btn--primary{background:var(--surface-raised);color:var(--action-500);box-shadow:var(--shadow-action-ring)}
.tc-btn--primary:hover,.tc-btn--primary:active{background:var(--graphite-700);box-shadow:var(--shadow-action-ring-hover)}
.tc-btn--primary:focus-visible{box-shadow:var(--shadow-action-ring-hover),var(--shadow-focus)}
.tc-btn--secondary{background:var(--surface-raised);color:var(--text-primary)}
.tc-btn--secondary:hover{background:var(--graphite-700)}
.tc-btn--ghost{background:transparent;color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-default)}
.tc-btn--ghost:hover{background:var(--surface-raised)}
.tc-btn--danger{background:var(--state-danger-bg);color:var(--state-danger)}
.tc-btn--sm{height:var(--size-control-sm);padding:0 var(--space-4);font-size:14px}
.tc-btn--block{display:flex;width:100%}
.tc-btn[aria-disabled="true"]{background:var(--surface-raised);background-image:none;box-shadow:none;color:var(--text-muted);cursor:default}

/* Bouton rond */
.tc-iconbtn{appearance:none;border:0;margin:0;width:var(--size-control);height:var(--size-control);border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;background:var(--surface-raised);color:var(--text-secondary);cursor:pointer;transition:background-color .15s,color .15s}
.tc-iconbtn:hover{color:var(--text-primary);background:var(--graphite-700)}
.tc-iconbtn--sm{width:var(--size-control-sm);height:var(--size-control-sm)}
.tc-iconbtn--plain{background:transparent}
.tc-iconbtn[aria-pressed="true"]{color:var(--text-strong);background:var(--graphite-700)}

/* Pastille d'état */
.tc-chip{--c:var(--state-none);display:inline-flex;align-items:center;gap:var(--space-2);font-size:15px;line-height:1.2;font-weight:400;color:var(--c)}
.tc-chip__dot{width:var(--size-chip-icon);height:var(--size-chip-icon);border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;background:var(--c);flex:none}
.tc-chip__dot .tc-icon{color:var(--bg-page)}
.tc-chip--ok{--c:var(--state-ok)}
.tc-chip--warn{--c:var(--state-warn)}
.tc-chip--danger{--c:var(--state-danger)}
.tc-chip--solid{padding:6px var(--space-3) 6px 10px;gap:6px;border-radius:var(--radius-pill);background:var(--c);color:var(--bg-page);font-weight:500}
.tc-chip--solid .tc-chip__dot{background:transparent;width:auto;height:auto}
.tc-chip--solid .tc-chip__dot .tc-icon{color:var(--bg-page);width:16px;height:16px;stroke-width:2}

/* Étiquette de nature de donnée */
.tc-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1px var(--border-default);font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--text-secondary)}
.tc-tag::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
.tc-tag--measured::before{background:var(--text-primary)}
.tc-tag--declared::before{background:linear-gradient(90deg,var(--text-primary) 50%,transparent 50%);box-shadow:inset 0 0 0 1px var(--text-primary)}
.tc-tag--interpreted::before{box-shadow:inset 0 0 0 1.5px var(--text-secondary)}

/* Chiffre en points */
.tc-dotnum{font-family:var(--font-dot);font-weight:800;font-variation-settings:"ROND" 100;line-height:.9;color:var(--text-strong);letter-spacing:-.06em}
.tc-dotnum--hero{font-size:72px}
.tc-dotnum--lg{font-size:52px}
.tc-dotnum--md{font-size:28px;line-height:1}

/* Chiffre */
.tc-metric{display:inline-flex;align-items:baseline;gap:4px;font-family:var(--font-sans);font-weight:300;color:var(--text-strong);line-height:1}
.tc-metric--xl{font-size:44px;letter-spacing:-.01em}
.tc-metric--lg{font-size:32px}
.tc-metric__unit{font-size:16px;font-weight:400;color:var(--text-muted)}

/* Graphique en traits fins */
.tc-strokes{display:flex;align-items:flex-end;gap:var(--chart-gap);height:56px;padding-left:4px}
.tc-strokes>i{display:block;width:var(--stroke-chart);min-height:4px;background:var(--chart-idle);border-radius:2px;transform:skewX(var(--chart-skew));transform-origin:bottom}
.tc-strokes>i.is-on{background:var(--text-primary)}
.tc-strokes--ok>i.is-on{background:var(--state-ok)}
.tc-strokes--warn>i.is-on{background:var(--state-warn)}
.tc-strokes--danger>i.is-on{background:var(--state-danger)}
.tc-strokes--on-ambiance>i{background:rgba(255,255,255,.22)}
.tc-strokes--on-ambiance>i.is-on{background:var(--text-on-ambiance)}

/* Histogramme en points */
.tc-dots{display:flex;align-items:flex-end;gap:var(--chart-dot-gap)}
.tc-dots--labeled{gap:calc(var(--chart-dot-gap) * 2)}
.tc-dots--lg{--chart-dot:6px;--chart-dot-gap:7px}
.tc-dots__col{display:flex;flex-direction:column-reverse;align-items:center;gap:var(--chart-dot-gap)}
.tc-dots__col>i{display:block;width:var(--chart-dot);height:var(--chart-dot);border-radius:50%;background:var(--graphite-700)}
.tc-dots__col>i.is-on{background:var(--text-primary)}
.tc-dots__col--ok>i.is-on{background:var(--state-ok)}
.tc-dots__col--warn>i.is-on{background:var(--state-warn)}
.tc-dots__col--danger>i.is-on{background:var(--state-danger)}
.tc-dots__lbl{font-size:11px;line-height:1.3;color:var(--text-muted);margin-top:6px;text-align:center;width:var(--chart-dot);display:flex;justify-content:center}

/* Barre de progression */
.tc-bar{--dot:var(--graphite-700);--on:var(--text-primary);display:flex;align-items:center;gap:var(--chart-dot-gap);width:100%;height:var(--chart-dot)}
.tc-bar>i{display:block;flex:none;width:var(--chart-dot);height:var(--chart-dot);border-radius:50%;background:var(--dot)}
.tc-bar>i.is-on{background:var(--on)}
.tc-bar--action{--on:var(--action-500)}
.tc-bar--ok{--on:var(--state-ok)}.tc-bar--warn{--on:var(--state-warn)}.tc-bar--danger{--on:var(--state-danger)}

/* Anneau de progression */
.tc-ring{--dot:var(--graphite-700);--on:var(--text-primary);position:relative;display:inline-flex;align-items:center;justify-content:center}
.tc-ring__dots{display:block}
.tc-ring__dots circle{fill:var(--dot)}
.tc-ring__dots circle.is-on{fill:var(--on)}
.tc-ring--action{--on:var(--action-500)}.tc-ring--ok{--on:var(--state-ok)}.tc-ring--warn{--on:var(--state-warn)}.tc-ring--danger{--on:var(--state-danger)}
.tc-ring__val{position:absolute}

/* Champ de saisie */
.tc-field{display:flex;flex-direction:column;gap:6px;width:100%}
.tc-field__label{font-size:13px;color:var(--text-secondary)}
.tc-field__input{appearance:none;height:var(--size-control);padding:0 var(--space-4);border:0;border-radius:var(--radius-md);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--border-default);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;font-variant-numeric:tabular-nums}
.tc-field__input::placeholder{color:var(--text-muted)}
.tc-field__input:focus{outline:none;box-shadow:var(--shadow-focus)}
.tc-field__hint{font-size:12px;color:var(--text-muted)}
.tc-field--error .tc-field__input{box-shadow:inset 0 0 0 1px var(--state-danger)}
.tc-field--error .tc-field__hint{color:var(--state-danger)}

/* Interrupteur */
.tc-switch{appearance:none;margin:0;position:relative;width:52px;height:30px;border-radius:var(--radius-pill);background:var(--graphite-700);cursor:pointer;transition:background-color .15s;flex:none}
.tc-switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--text-secondary);transition:transform .15s,background-color .15s}
.tc-switch:checked{background:var(--graphite-600)}
.tc-switch:checked::after{transform:translateX(22px);background:var(--text-strong)}

/* ===== MOLÉCULES ===== */

/* En-tête de carte */
.tc-cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3)}
.tc-cardhead__title{margin:0;font-family:var(--font-sans);font-size:17px;line-height:1.25;font-weight:400;color:var(--text-strong);max-width:16ch}
.tc-cardhead__meta{display:block;margin-top:4px;font-size:13px;line-height:1.4;color:var(--text-muted)}
.tc-cardhead__aside{display:flex;align-items:center;gap:var(--space-2);color:var(--text-secondary);flex:none}
.tc-cardhead--ambiance .tc-cardhead__title{font-size:22px;line-height:1.2;font-weight:400;color:var(--text-on-ambiance);max-width:none}
.tc-cardhead--ambiance .tc-cardhead__meta,.tc-cardhead--ambiance .tc-cardhead__aside{color:var(--text-on-ambiance-muted)}

/* Bloc chiffre */
.tc-mblock{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)}
.tc-mblock>.tc-chip{margin-bottom:var(--space-3)}
.tc-mblock__caption{font-size:13px;line-height:1.4;color:var(--text-muted)}
.tc-mblock__row{display:flex;align-items:center;gap:var(--space-2)}

/* Cible allure / FC / watts */
.tc-targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.tc-target{display:flex;flex-direction:column;gap:6px;padding:var(--space-3);border-radius:var(--radius-sm);background:var(--surface-raised)}
.tc-target__label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--text-secondary)}
.tc-target__value{font-size:20px;font-weight:300;line-height:1.1;color:var(--text-strong);white-space:nowrap;letter-spacing:-.01em}
.tc-target__unit{display:block;margin-top:2px;font-size:12px;font-weight:400;letter-spacing:0;color:var(--text-muted)}

/* Étape numérotée */
.tc-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tc-step{display:grid;grid-template-columns:28px 1fr auto;gap:var(--space-3);align-items:start;padding:var(--space-3) 0;border-top:1px solid var(--border-subtle)}
.tc-step:first-child{border-top:0}
.tc-step__num{width:28px;height:28px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;background:var(--surface-raised);font-size:13px;font-weight:500;color:var(--text-primary)}
.tc-step__title{font-size:15px;line-height:1.45;color:var(--text-primary)}
.tc-step__desc{font-size:13px;line-height:1.4;color:var(--text-muted);margin-top:2px}
.tc-step__dur{font-size:15px;font-weight:300;color:var(--text-strong);white-space:nowrap;padding-top:1px}

/* Échelle d'effort 1–10 */
.tc-effort{display:flex;flex-direction:column;gap:var(--space-2)}
.tc-effort__scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tc-effort__btn{appearance:none;border:0;margin:0;height:var(--size-touch-min);border-radius:var(--radius-pill);background:var(--surface-raised);color:var(--text-secondary);font-family:var(--font-sans);font-size:15px;cursor:pointer;position:relative}
.tc-effort__btn.is-expected::after{content:"";position:absolute;left:50%;bottom:-8px;width:var(--chart-dot);height:var(--chart-dot);margin-left:calc(var(--chart-dot) / -2);border-radius:50%;background:var(--text-secondary)}
.tc-effort__btn[aria-pressed="true"]{background:var(--text-strong);color:var(--bg-page);font-weight:500}
.tc-effort__btn[aria-pressed="true"].is-above{background:var(--state-warn)}
.tc-effort__legend{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:6px}
.tc-effort__note{font-size:13px;color:var(--text-muted)}
.tc-effort__note--warn{color:var(--state-warn)}

/* Choix du jour */
.tc-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tc-day{appearance:none;border:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:var(--radius-md);background:var(--surface-raised);color:var(--text-primary);font-family:var(--font-sans);cursor:pointer;position:relative}
.tc-day__d{font-size:12px;color:var(--text-muted)}
.tc-day__n{font-size:16px;font-weight:400}
.tc-day.is-slot::after{content:"";position:absolute;bottom:6px;width:var(--chart-dot);height:var(--chart-dot);border-radius:50%;background:var(--text-secondary)}
.tc-day[aria-pressed="true"]{background:var(--text-strong);color:var(--bg-page)}
.tc-day[aria-pressed="true"] .tc-day__d{color:var(--graphite-600)}
.tc-day[aria-pressed="true"].is-slot::after{background:var(--bg-page)}
.tc-day[aria-disabled="true"]{background:transparent;color:var(--text-muted);box-shadow:inset 0 0 0 1px var(--border-subtle);cursor:default}
.tc-day[aria-disabled="true"] .tc-day__d{color:var(--text-muted)}
.tc-days__note{font-size:13px;color:var(--text-muted);margin-top:var(--space-2)}

/* Sélecteur à onglets */
.tc-seg{display:inline-flex;padding:4px;gap:4px;border-radius:var(--radius-pill);background:var(--surface-sunken);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.tc-seg__btn{appearance:none;border:0;margin:0;height:var(--size-control-sm);padding:0 var(--space-5);border-radius:var(--radius-pill);background:transparent;color:var(--text-secondary);font-family:var(--font-sans);font-size:14px;cursor:pointer}
.tc-seg__btn[aria-selected="true"]{background:var(--graphite-700);color:var(--text-strong)}
.tc-seg--block{display:flex}.tc-seg--block .tc-seg__btn{flex:1}

/* Badge séance */
.tc-sbadge{appearance:none;border:0;margin:0;display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:var(--size-touch-min);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--text-primary);font-family:var(--font-sans);text-align:left;cursor:pointer}
.tc-sbadge__icon{color:var(--text-secondary);display:inline-flex;flex:none}
.tc-sbadge__end{display:flex;align-items:center;gap:var(--space-2);flex:none}
.tc-sbadge__main{display:flex;flex-direction:column;min-width:0;flex:1}
.tc-sbadge__title{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sbadge__meta{font-size:12px;color:var(--text-muted)}
.tc-sbadge__tag{flex:none;font-size:11px;font-weight:500;letter-spacing:.04em;padding:2px 8px;border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1px var(--border-default);color:var(--text-secondary)}
.tc-sbadge__tag--key{box-shadow:none;background:var(--text-strong);color:var(--bg-page)}
.tc-sbadge--removed{background:transparent;box-shadow:inset 0 0 0 1px var(--border-subtle)}

/* Ligne de menu */
.tc-menu{display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--surface-card);overflow:hidden}

/* ════ Étape 3 — anciens composants alignés sur le design system Tri Coach Dark ════ */

.cta{height:var(--size-control);border-radius:var(--radius-pill);font-size:15px;font-weight:500}

.daychips button.on{background:var(--text-strong);color:var(--bg-page)}
/* Boutons historiques */
.btn{border-radius:var(--radius-pill);font-weight:500;min-height:var(--size-control);padding:0 var(--space-5)}

.sheet{background:var(--surface-sunken);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet)}
.sheet .modal-t{font-size:22px;font-weight:400;color:var(--text-strong);letter-spacing:0}

.modal{background:var(--surface-sunken);border-radius:var(--radius-xl);box-shadow:var(--shadow-sheet)}

button.abadge,button.wk,button.brow,button.mrow{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;margin:0;border-left:0;border-right:0}

button.oback{appearance:none;border:0;padding:0;font:inherit}
.rdots button.d{appearance:none;padding:0;margin:0}
/* Accueil (étape 2) */
.home{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-2)}

.home-hello__meta{font-size:14px;color:var(--text-on-ambiance-muted);margin-top:6px}
.home-stats{display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.home-stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--text-muted)}
.home-stat b{font-weight:400;font-size:15px;color:var(--text-strong)}
.home-tags{display:flex;gap:6px;margin-top:var(--space-4)}

.home-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:12px}
.home-week__blocks{margin-top:var(--space-5);padding-top:var(--space-4);border-top:1px solid var(--border-subtle)}
.home-blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.home-block__t{font-size:11px;color:var(--text-muted);margin:2px 0 8px;min-height:28px}

<script>
"use strict";
/* ════════════ Icônes SVG inline (aucune dépendance externe) ════════════

const _ic=(vb,body,sw)=>`<svg viewBox="${vb}" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" style="display:block;overflow:visible">${body}</svg>`;

const ICONS={
  /* ── activités (extraites du logo, recadrées) ── */
  swim:_ic("176 440 200 120",
    '<path d="M209 486C232 457 255 451 276 468c16 13 28 24 53 24"/><circle cx="344" cy="469" r="15"/>'+

  bike:_ic("395 165 230 140",
    '<circle cx="445" cy="252" r="42"/><circle cx="579" cy="252" r="42"/>'+

 return [

 ];

function parsePaceSec(v){const m=/^\s*(\d{1,2}):([0-5]?\d)\s*$/.exec(String(v||""));if(!m)return null;const s=(+m[1])*60+(+m[2]);return s>0?s:null;}

  if(sport==="cap"){if(z.pace){const[a,b]=PACE_OFF[zone];out.push(`Allure ${fmtPace(z.pace+a)}–${fmtPace(z.pace+b)} /km`);}if(z.fc){const[a,b]=HR_PCT[zone];out.push(`FC ${Math.round(z.fc*a)} à ${Math.round(z.fc*b)} bpm`);}}

  return out.join(" · ");}

"use strict";
/* ════════════ Suivi data — seuils & état ════════════ */
const CLEARANCE_CARDIAQUE="2019-01-01", MOIS_CLEARANCE_MAX=12;
const SEUILS={sleep:{vert:6.5,orange:6.0},sleepDelta:{vert:-0.5,orange:-1.5},fcRepos:{vert:3,orange:5},fcTrend:{vert:3,orange:7},tsb:{vert:-10,orange:-25}};
const NIV={vert:0,orange:1,rouge:2,na:-1};
const pire=(a,b)=>NIV[a]>=NIV[b]?a:b;
const num=(n,d=1)=>n==null?"—":(Math.round(n*10**d)/10**d).toLocaleString("fr-FR");
const daysSince=iso=>Math.floor((Date.now()-new Date(iso))/864e5);
const LVLC={vert:"var(--state-success)",orange:"var(--state-warning)",rouge:"var(--state-danger)",na:"var(--text-muted)"};

function buildRecup(){
  const d=S.wellness, L=[];
  if(!d||d.empty||(d.sleep_h==null&&d.resting_hr==null))
    return {levels:L,state:"down",label:"Récup — aucune donnée"};
  const sl=typeof d.sleep_h==="number"?d.sleep_h:null, bsl=typeof d.sleep_baseline_7d==="number"?d.sleep_baseline_7d:null;
  const hr=typeof d.resting_hr==="number"?d.resting_hr:null, bhr=typeof d.resting_hr_baseline_7d==="number"?d.resting_hr_baseline_7d:null;
  const tr=typeof d.resting_hr_trend_7d==="number"?d.resting_hr_trend_7d:null;
  // Niveaux conservés pour le verdict « le plus conservateur gagne », même si non affichés en direct.
  let lvl=sl==null?"na":sl>=SEUILS.sleep.vert?"vert":sl>=SEUILS.sleep.orange?"orange":"rouge"; if(lvl!=="na")L.push(lvl);
  let hrDelta=null;
  if(sl!=null&&bsl!=null){const del=Math.round((sl-bsl)*10)/10; L.push(del<SEUILS.sleepDelta.orange?"rouge":del<SEUILS.sleepDelta.vert?"orange":"vert");}
  if(hr!=null&&bhr!=null){hrDelta=Math.round((hr-bhr)*10)/10; L.push(hrDelta>SEUILS.fcRepos.orange?"rouge":hrDelta>SEUILS.fcRepos.vert?"orange":"vert");}
  if(tr!=null)L.push(tr>SEUILS.fcTrend.orange?"rouge":tr>SEUILS.fcTrend.vert?"orange":"vert");
  return {levels:L,state:"ok",label:"Récup à jour"};
}
function buildCharge(){
  const s=S.charge, L=[];

    return {levels:L,state:"down",label:"Charge — aucune donnée"};

function formeDuJour(){

/* ════════════ Prochaine séance — addon triathlon-coach ════════════
   Backend : /api/next-session (netlify/functions/next-session.mjs).
   Le front envoie la séance PRÉVUE ; le serveur renvoie maintenir / alléger /
   remplacer / repos. Le verdict Suivi data est transmis : le plus prudent gagne. */
const NS_DEC={maintenir:["Maintenir","exécute la séance prévue"],alleger:["Alléger","même séance, moins de charge"],
  remplacer:["Remplacer","récupération active à la place"],repos:["Repos","priorité à la récupération"]};

const DAY_FULL=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
function suiviLevel(){const R=buildRecup(),C=buildCharge();return R.levels.concat(C.levels).reduce((a,c)=>pire(a,c),"na");}
function nextPlanned(){
  const td=(new Date().getDay()+6)%7;
  for(const w of [S.currentWeek,S.currentWeek+1]){
    if(w>30)break;
    const list=weekSessions(w).filter(x=>!x.dropped&&!statusOf(x.id)).sort((a,b)=>a.dayEff-b.dayEff);
    const f=w===S.currentWeek?list.find(x=>x.dayEff>=td):list[0];

}

async function fetchNext(){
  const key=S.nextKey, p=nextPlanned();

  const prm=new URLSearchParams({sport:p.sport,type:p.type,minutes:String(p.minutes),name:p.name,zone:mainZone(p),id:p.id});
  if(READ_TOKEN)prm.set("token",READ_TOKEN);
  if(S.fcMax)prm.set("fcmax",S.fcMax); if(S.ftp)prm.set("ftp",S.ftp); if(S.pace)prm.set("pace",S.pace);
  if(daysSince(CLEARANCE_CARDIAQUE)>MOIS_CLEARANCE_MAX*30)prm.set("cap","1");
  if(S.feel==="fatigue")prm.set("feel","fatigue");
  const lv=suiviLevel(); if(lv!=="na")prm.set("suivi",lv);

  try{const r=await fetch("/api/next-session?"+prm.toString(),{cache:"no-store"});j=await r.json();}
  catch(_){j={ok:false,error:"Réseau indisponible"};}
  if(key!==S.nextKey)return;            // réponse périmée (paramètres changés entre-temps)

/* ════════════ Moteur d'adaptation ════════════
   Plan de référence (buildWeek, jamais modifié) + journal d'ajustements S.adj
   = plan effectif (weekSessions). Chaque ajustement porte son motif et s'annule.
   Règle : le plus prudent gagne ; le moteur allège, déplace ou retire, il n'ajoute jamais. */
const EXPECTED_EFFORT={club:5,endurance:4,technique:4,mobility:3,quality:7,strength:4};
const DAY_LONG=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const round5=m=>Math.max(10,Math.round(m/5)*5);
const todayIdx=()=>(new Date().getDay()+6)%7;
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDate=iso=>new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
function applyReduce(x,pct,easy){
  x.minutes=round5(x.minutes*(1-pct/100));
  if(easy&&x.type==="quality"){x.type="endurance";
    x.name=x.sport==="cap"?`${x.minutes}' Z2 continu`:x.brick?"Sortie Z2 souple (sans course)":"Sortie Z2 souple";x.brick=0;}
}
function weekSessions(n){
  const base=buildWeek(n).map(x=>({...x,week:n,dayEff:S.moves[x.id]??x.day}));
  const map=Object.fromEntries(base.map(x=>[x.id,x]));
  for(const op of S.adj){
    if(op.week!==n)continue;
    if(op.kind==="weekReduce"){
      base.forEach(x=>{if(x.sport==="natation")return;applyReduce(x,op.pct,op.noKey);
        if(op.noKey&&x.prio==="cle")x.prio="support";x.adjMotif=op.motif;x.adjOp=op.id;});
      continue;}
    const x=map[op.sid]; if(!x)continue;
    if(op.kind==="move")x.dayEff=op.day;
    else if(op.kind==="reduce")applyReduce(x,op.pct,op.easy);
    else if(op.kind==="drop")x.dropped=true;
    else if(op.kind==="replace")Object.assign(x,{name:op.name,minutes:op.minutes,type:op.type});
    if(op.day!=null&&op.kind!=="move")x.dayEff=op.day;
    if(op.kind!=="advance"){x.adjMotif=op.motif;x.adjOp=op.id;}
  }
  return base;
}
const activeSessions=n=>weekSessions(n).filter(x=>!x.dropped);
function addOp(op){op.id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);op.ts=Date.now();S.adj.push(op);persist();return op;}
function undoOp(id){
  const op=S.adj.find(o=>o.id===id); if(!op)return;
  S.adj=S.adj.filter(o=>o.id!==id);
  if(op.prevStatus)Object.assign(S.status,op.prevStatus);
  if(op.prevWeek!=null)S.currentWeek=op.prevWeek;
  if(op.bilanWeek!=null)delete S.bilanDone[op.bilanWeek];
  persist();
}
function weekStatuses(n){const o={};buildWeek(n).forEach(x=>{if(S.status[x.id])o[x.id]=S.status[x.id];});return o;}
function clearWeekStatuses(n){buildWeek(n).forEach(x=>{delete S.status[x.id];delete S.rpe[x.id];});}
const isHard=s=>!s.dropped&&s.type==="quality";
function hardAround(ws,d,exceptId){return ws.some(o=>o.id!==exceptId&&isHard(o)&&Math.abs(o.dayEff-d)<=1);}

/* Séance manquée : règles par sport et par priorité. earliest = premier jour possible pour la replacer. */
function missed(s,earliest,src){
  const n=s.week, ws=weekSessions(n), base={week:n,sid:s.id,src:src||"imprevu"};
  if(s.sport==="natation")
    return addOp({...base,kind:"drop",motif:"Séance club manquée : on ne la rattrape pas."});
  if(s.sport==="ppg"){
    const host=ws.filter(o=>!o.dropped&&o.id!==s.id&&o.dayEff>=earliest&&o.type!=="quality"&&o.sport!=="ppg"&&!statusOf(o.id)).sort((a,b)=>a.dayEff-b.dayEff)[0];
    if(host)return addOp({...base,kind:"replace",name:"Gainage express",minutes:15,type:"mobility",day:host.dayEff,
      motif:`PPG manquée : 15 min de gainage après ta séance de ${DAY_LONG[host.dayEff]}, pas de séance complète en dette.`});
    return addOp({...base,kind:"drop",motif:"PPG manquée : pas de séance facile d'ici dimanche pour y greffer 15 min de gainage. On passe."});
  }
  const isLong=s.sport==="velo"&&s.type!=="quality";
  if(s.type==="quality"||s.prio==="cle"){
    const allowed=s.sport==="velo"?[5,6]:[0,1,2,3,4,5,6];
    const cand=allowed.filter(d=>d>=earliest&&d<=Math.min(6,earliest+1)&&d!==s.dayEff);
    const d=cand.find(d=>s.type!=="quality"||!hardAround(ws,d,s.id));
    if(d!=null){
      if(isLong)return addOp({...base,kind:"reduce",pct:30,easy:false,day:d,
        motif:`Sortie longue décalée à ${DAY_LONG[d]}, à 70 % du volume : on ne rattrape pas tout.`});
      return addOp({...base,kind:"move",day:d,motif:`Séance clé décalée à ${DAY_LONG[d]} : la veille et le lendemain restent sans séance dure.`});
    }
    return addOp({...base,kind:"drop",motif:isLong?"Pas de créneau ce week-end : on passe à la semaine suivante sans empiler."
      :"Pas de créneau sous 48 h sans enchaîner deux séances dures : on ne rattrape pas, la suivante reste prioritaire."});
  }
  return addOp({...base,kind:"drop",motif:"Séance d'endurance manquée : on ne la rattrape pas. Reprends simplement la suivante."});
}
function imprevuMissed(id){
  const f=sessionById(id); if(!f)return;
  const s=f.session, base=s.week===S.currentWeek?Math.max(s.dayEff,todayIdx()):s.dayEff;
  const op=missed(s,base+1); S.flash=op.motif;
}
function imprevuShort(id){

function imprevuAway(nDays){

  const hit=weekSessions(n).filter(x=>!x.dropped&&!statusOf(x.id)&&x.dayEff>=td&&x.dayEff<=end).sort((a,b)=>a.dayEff-b.dayEff);

  const out=hit.map(s=>missed(s,end+1).motif);
  S.flash=`Absent ${nDays} jours : ${hit.length} séance${hit.length>1?"s":""} ajustée${hit.length>1?"s":""}. `+out[out.length-1]+(hit.length>1?" Le détail est dans Bilan › Ajustements.":"");

const PAUSE_LBL={vacances:"Vacances",malade:"Malade ou blessé"};
function startPause(reason){S.pause={reason,from:todayISO()};S.detailId=null;S.sheet=null;
  S.flash=reason==="vacances"?"Plan en pause. Fais le sport que tu veux : ce que ta montre enregistre compte dans ta charge.":"Plan en pause. Repos, et reprends quand tu n'as plus de symptôme.";persist();}
function endPause(){
  const p=S.pause; if(!p)return;
  const days=Math.max(0,daysSince(p.from)), ill=p.reason==="malade";
  const lvl=ill?(days<3?0:days<=7?1:2):(days<7?0:days<=14?1:2);
  S.pause=null;
  if(lvl===0){S.flash=`Pause de ${days} j : reprise telle que prévue.`;persist();return;}
  const target=lvl===2?Math.max(1,S.currentWeek-1):S.currentWeek;
  const op=addOp({week:target,kind:"weekReduce",pct:30,noKey:true,src:"reprise",prevWeek:S.currentWeek,prevStatus:weekStatuses(target),

      :`Reprise après ${days} j (${PAUSE_LBL[p.reason].toLowerCase()}) : semaine à −30 %, sans séance clé.`});

/* Effort ressenti : 2 séances de suite notées 2 points au-dessus du prévu → la prochaine séance clé est allégée. */
function expectedEffort(s){return EXPECTED_EFFORT[s.type]??4;}
function checkEffortDrift(){
  const rated=[];
  for(const w of [S.currentWeek-1,S.currentWeek]){if(w<1)continue;
    weekSessions(w).filter(x=>S.rpe[x.id]!=null).sort((a,b)=>a.dayEff-b.dayEff).forEach(x=>rated.push(x));}
  const last=rated.slice(-2);
  if(last.length<2||!last.every(x=>S.rpe[x.id]>=expectedEffort(x)+2))return;
  for(const w of [S.currentWeek,S.currentWeek+1]){if(w>30)break;
    const t=weekSessions(w).filter(x=>!x.dropped&&!statusOf(x.id)&&(w!==S.currentWeek||x.dayEff>=todayIdx())&&(x.prio==="cle"||x.type==="quality")).sort((a,b)=>a.dayEff-b.dayEff)[0];
    if(t){if(S.adj.some(o=>o.sid===t.id&&o.src==="auto"))return;
      const op=addOp({week:w,sid:t.id,src:"auto",kind:"reduce",pct:15,easy:true,
        motif:"Effort ressenti plus élevé que prévu sur tes 2 dernières séances : la prochaine séance clé passe en version allégée."});
      S.flash=op.motif;return;}
  }
}

/* Bilan de la semaine */
function bilanFor(n){
  const all=weekSessions(n), act=all.filter(x=>!x.dropped), dropped=all.filter(x=>x.dropped);
  const doneL=act.filter(x=>["done","z2"].includes(statusOf(x.id)));
  const minDone=doneL.reduce((a,x)=>a+x.minutes,0), minPlan=act.reduce((a,x)=>a+x.minutes,0);
  const td=todayIdx(), due=all.filter(x=>x.dayEff<=td), conf=due.length?Math.round(due.filter(x=>["done","z2"].includes(statusOf(x.id))).length/due.length*100):100, partial=td<6;
  const rated=all.filter(x=>S.rpe[x.id]!=null);
  const effAvg=rated.length?rated.reduce((a,x)=>a+S.rpe[x.id],0)/rated.length:null;
  const expAvg=rated.length?rated.reduce((a,x)=>a+expectedEffort(x),0)/rated.length:null;
  const felt=doneL.reduce((a,x)=>a+(S.rpe[x.id]||0)*x.minutes,0);
  const drift=rated.filter(x=>S.rpe[x.id]>=expectedEffort(x)+2).length;
  const p=(S.charge&&S.charge.pmc)||{}, tsb=typeof p.tsb==="number"?p.tsb:null, lvl=suiviLevel();
  let score=0; const why=[];
  if(lvl==="rouge"){score+=2;why.push("feu rouge ce matin");} else if(lvl==="orange"){score+=1;why.push("feu orange ce matin");}
  if(tsb!=null&&tsb<SEUILS.tsb.orange){score+=1;why.push("fraîcheur très basse");}
  if(drift>=2){score+=1;why.push("effort ressenti au-dessus du prévu");}
  let dec;
  if(n>=30)dec={key:"end",label:"Programme terminé",desc:"Les 30 semaines sont bouclées."};
  else if(conf<50&&due.length>=2&&!RECOVERY_WEEKS.includes(n))dec={key:"redo",label:`Refaire la semaine ${n}`,desc:"Moins de la moitié des séances prévues à ce jour sont faites : on consolide avant d'avancer."};
  else if(score>=2)dec={key:"light",label:`Semaine ${n+1} allégée (−20 %)`,desc:"Signaux de fatigue : "+why.join(", ")+"."};
  else dec={key:"next",label:`Passer à la semaine ${n+1}, telle que prévue`,desc:why.length?"Un signal à surveiller ("+why.join(", ")+"), pas assez pour alléger.":"Rien ne demande d'ajuster."};
  return {all,act,dropped,doneL,minDone,minPlan,conf,due,partial,effAvg,expAvg,felt,rated,tsb,dec};
}
function validateBilan(){
  const n=S.currentWeek, b=bilanFor(n), d=b.dec;
  if(d.key==="end")return;
  if(d.key==="redo"){addOp({week:n,kind:"advance",src:"bilan",bilanWeek:n,prevStatus:weekStatuses(n),motif:`Bilan semaine ${n} : on refait la semaine (moins de la moitié des séances faites).`});clearWeekStatuses(n);}
  else if(d.key==="light"){addOp({week:n+1,kind:"weekReduce",pct:20,noKey:false,src:"bilan",bilanWeek:n,prevWeek:n,motif:`Bilan semaine ${n} : semaine ${n+1} allégée de 20 % (fatigue).`});S.currentWeek=n+1;}
  else {addOp({week:n,kind:"advance",src:"bilan",bilanWeek:n,prevWeek:n,motif:`Bilan semaine ${n} : passage à la semaine ${n+1}, telle que prévue.`});S.currentWeek=n+1;}
  S.bilanDone[n]=d.key; S.flash=d.label+" : c'est enregistré."; persist();
}
function freshnessText(t){
  if(t==null)return "Pas de donnée de fraîcheur.";
  if(t>5)return "Tu es frais : la charge récente est plus basse que ce que tu encaisses d'habitude.";
  if(t>=SEUILS.tsb.vert)return "Équilibré : tu encaisses ta charge sans t'enfoncer.";
  if(t>=SEUILS.tsb.orange)return "Chargé, mais normal en semaine d'entraînement.";

}

    <div class="pm">${esc(e.muscles)}</div><div class="pcue">${esc(e.cue)}</div></div></div>`).join("");
  const ppgHead=exs.length?(()=>{const c=ppgCircuitFor(session);return `<div class="card" style="padding:12px 14px"><div style="font-size:17px;font-weight:400;color:var(--text-strong);margin-bottom:6px">Format circuit</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.5"><strong>${c.tours} tours</strong> de la liste · récup ${esc(c.rest)} entre les tours. Doses indiquées <strong>par tour</strong>.</div><div style="font-size:12px;color:var(--text-muted);line-height:1.45;margin-top:6px">${esc(c.note)}</div></div>`;})():"";
  return `<div class="ovl">
    <div class="ohead">
      <button type="button" aria-label="Retour" class="oback" data-act="closeDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="o-eyebrow">Semaine ${week} · ${esc(blk.title)}</div>
      <div class="o-title">${esc(session.name)}</div>
      <div class="o-facts">
        <span class="o-pill" style="color:#fff">${icon(SPORT_META[session.sport].icon)}${SLBL[session.sport]||""}</span>
        <span class="o-pill"><span class="num">${fmtMin(session.minutes)}</span></span>
        <span class="o-pill">${esc(TYPE_LABELS[session.type]||"Séance")}</span>
        ${sPill}
      </div>
    </div>
    <div style="padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px">
      ${flashCard()}
      ${session.adjMotif?`<div class="adjnote"><b>${session.dropped?"Retirée du plan":"Ajustée par le plan"}</b>${esc(session.adjMotif)}${session.adjOp&&!S.adj.find(o=>o.id===session.adjOp&&o.kind==="weekReduce")?`<div style="margin-top:10px"><button class="cta ghost sm" data-act="undo" data-arg="${session.adjOp}">${session.dropped?"Remettre la séance":"Annuler l'ajustement"}</button></div>`:""}</div>`:""}
      ${session.dropped||st?"":detailDecision(session,intention)}
      ${session.sport==="natation"?`<button class="rt-open" data-act="openRoutine"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="tx"><h4>Échauffement</h4><p>Routine mobilité + activation · ${ROUTINE_NATATION.length} étapes</p></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span></button>`:""}
      ${detailTargets(session,mz)}
      ${(obj||body.length)?`<section class="tc-card"><h3 class="tc-cardhead__title" style="max-width:none;margin-bottom:${obj?"6px":"4px"}">Déroulé</h3>${obj?`<div class="tc-mblock__caption" style="margin-bottom:6px">${esc(obj.desc)}</div>`:""}${body.length?`<ol class="tc-steps">${body.map((x,i)=>{const t=String(x.title).replace(/^\d+\.\s*/,"");const zt=(session.sport==="cap"||session.sport==="velo")?targetStr(session.sport,zoneForStep(x.title,mz)):"";const key=session.type==="quality"&&/corps|bloc|vélo|course/i.test(t)&&!/échauff|retour/i.test(t);return `<li class="tc-step"><span class="tc-step__num${key?" tc-step__num--key":""}">${i+1}</span><div><div class="tc-step__title">${esc(t)}</div><div class="tc-step__desc">${esc(x.desc)}</div>${zt?`<div class="tc-step__desc" style="color:var(--text-secondary)">${esc(zt)}</div>`:""}${key?repStrokes(session.name):""}</div><span></span></li>`;}).join("")}</ol>`:""}</section>`:""}
      ${exs.length?`<div class="sechead" style="margin:8px 2px 0"><h3>Exercices PPG</h3></div>`+ppgHead+ppgRows:""}
      ${session.dropped?"":detailDays(session,cur,week)}
      ${session.dropped?"":(st==="done"||st==="z2")?`<section class="tc-card"><h3 class="tc-cardhead__title" style="max-width:none;margin-bottom:14px">Effort ressenti</h3>${dsEffort(session)}
        <div class="tc-card__foot" style="justify-content:flex-end"><button class="tc-btn tc-btn--ghost" data-act="st" data-arg="">Réinitialiser le statut</button></div></section>`
        :st==="missed"?`<section class="tc-card"><div class="tc-card__body home-next__text">Séance notée comme ratée.</div><div class="tc-card__foot" style="justify-content:flex-end"><button class="tc-btn tc-btn--ghost" data-act="st" data-arg="">Réinitialiser le statut</button></div></section>`:""}
    </div>
    ${session.dropped||st?"":`<div class="tc-actionbar"><button class="tc-btn tc-btn--primary" data-act="st" data-arg="done">${dsIcon("check").replace('<svg ','<svg width="20" height="20" ')}C'est fait</button><button class="tc-btn tc-btn--ghost" data-act="st" data-arg="z2">En facile</button><button class="tc-btn tc-btn--ghost" data-act="sheetOpen" data-arg="imprevu">Imprévu</button></div>`}
  </div>`;
}
</script>
<script>
"use strict";
/* ════════════ Rendu ════════════ */
const SCREENS={overview:screenOverview,calendar:screenCalendar,bilan:screenBilan,settings:screenSettings,ppg:screenPPG};
function confirmModal(){
  const c=S.confirm||{};
  return `<div class="modal-back"><div class="modal">
    <div class="modal-t">Confirmation</div>
    <div class="modal-m">${esc(c.msg||"Confirmer ?")}</div>
    <div class="modal-row">
      <button class="btn secondary" data-act="confirmNo">Annuler</button>
      <button class="btn" style="background:var(--state-danger-bg);color:var(--state-danger);border:0" data-act="confirmYes">Réinitialiser</button>
    </div>
  </div></div>`;
}
function render(){
  const fn=SCREENS[S.view]||screenOverview;
  document.getElementById("app").innerHTML=fn();
  const ov=document.querySelector(".ovl"), keep=ov&&S.detailId===render._last?ov.scrollTop:0; render._last=S.detailId;
  document.getElementById("overlay").innerHTML=S.confirm?confirmModal():((S.detailId?overlayDetail():"")+(S.detailId&&S.sheet?imprevuSheet():"")+(S.routineOpen?overlayRoutine():""));
  const ov2=document.querySelector(".ovl"); if(ov2&&keep)ov2.scrollTop=keep;
  document.getElementById("navwrap").classList.toggle("hidden",!!S.detailId||!!S.confirm);
  const navMap={ppg:"settings"};
  const active=navMap[S.view]||S.view;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===active));
  window.scrollTo({top:0});
  if(S.dataReady)ensureNext();
}

/* ════════════ Actions ════════════ */

const ACTIONS={
  open:a=>{S.detailId=a;render();},
  closeDetail:()=>{S.detailId=null;S.sheet=null;S.flash=null;render();},
  flashClose:()=>{S.flash=null;render();},
  sheetOpen:a=>{S.sheet=a;render();},
  sheetClose:()=>{S.sheet=null;render();},
  impMissed:()=>{imprevuMissed(S.detailId);S.sheet=null;render();},
  impShort:()=>{imprevuShort(S.detailId);S.sheet=null;render();},
  away:a=>{imprevuAway(Number(a));S.sheet=null;S.detailId=null;S.view="calendar";S.calendarMode="Semaine";render();},
  pause:a=>{startPause(a);S.view="overview";render();},
  endPause:()=>{endPause();render();},
  rpe:a=>{S.rpe[S.detailId]=Number(a);persist();checkEffortDrift();render();},
  undo:a=>{undoOp(a);S.flash="Ajustement annulé.";render();},
  validateBilan:()=>{validateBilan();render();},
  openRoutine:()=>{routineIdx=0;S.routineOpen=true;render();},
  closeRoutine:()=>{S.routineOpen=false;render();},
  routineNav:a=>{routineGo(routineIdx+(a==="next"?1:-1));},
  routineDot:a=>{routineGo(Number(a));},
  st:a=>{setStatus(S.detailId,a);},
  setDay:a=>{setDay(S.detailId,Number(a));},
  toSuivi:()=>{const el=document.getElementById("suivi-data");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},
  go:a=>{S.flash=null;if(a==="calendar-liste"){S.view="calendar";S.calendarMode="Liste";}else S.view=a;render();},
  week:a=>{S.currentWeek=Number(a);persist();render();},
  "week-go":a=>{S.currentWeek=Number(a);S.calendarMode="Semaine";persist();render();},
  calmode:a=>{S.calendarMode=a;render();},
  saveZones:()=>{S.fcMax=(document.getElementById("fFcMax")||{}).value||"";
    S.pace=(document.getElementById("fPace")||{}).value||"";
    S.ftp=(document.getElementById("fFtp")||{}).value||"";persist();render();},
  saveRace:()=>{S.raceName=(document.getElementById("fRace")||{}).value||"";
    S.raceDate=(document.getElementById("fRaceDate")||{}).value||"";persist();render();},
  resetTracking:()=>{S.confirm={kind:"tracking",msg:"Réinitialiser le suivi ? Statuts, déplacements, efforts ressentis, ajustements et bilans seront effacés."};render();},
  resetProgram:()=>{S.confirm={kind:"program",msg:"Remettre à zéro le programme complet ? Statuts, déplacements, zones et course cible seront effacés."};render();},
  confirmNo:()=>{S.confirm=null;render();},
  confirmYes:()=>{const k=S.confirm&&S.confirm.kind;S.confirm=null;S.status={};S.moves={};S.adj=[];S.rpe={};S.pause=null;S.bilanDone={};if(k==="program"){S.fcMax=S.pace=S.ftp=S.raceName=S.raceDate="";}persist();render();}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const fn=ACTIONS[el.dataset.act];
  if(fn){e.preventDefault();fn(el.dataset.arg);}
});
document.addEventListener("change",e=>{
});
/* Carrousel routine : swipe tactile + clavier */
let _rsx=null,_rsy=null;
document.addEventListener("touchstart",e=>{if(!S.routineOpen||!e.target.closest(".rvp"))return;_rsx=e.touches[0].clientX;_rsy=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(!S.routineOpen||_rsx===null)return;
  const dx=e.changedTouches[0].clientX-_rsx,dy=e.changedTouches[0].clientY-_rsy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))routineGo(routineIdx+(dx<0?1:-1));
  _rsx=_rsy=null;
});
document.addEventListener("keydown",e=>{
  if(!S.routineOpen)return;
  if(e.key==="ArrowRight")routineGo(routineIdx+1);
  else if(e.key==="ArrowLeft")routineGo(routineIdx-1);
  else if(e.key==="Escape"){S.routineOpen=false;render();}
});
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");
  if(b){S.view=b.dataset.v;S.detailId=null;S.sheet=null;S.flash=null;render();}
});

/* ════════════ Données ════════════ */
const READ_TOKEN='0q}"9Mux460l';  // variable d'environnement READ_TOKEN (Netlify)
function q(u){return READ_TOKEN?u+"?token="+encodeURIComponent(READ_TOKEN):u;}
async function grab(u){try{const r=await fetch(q(u),{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(_){return null;}}
async function loadData(){
  const [w,c]=await Promise.all([grab("/api/wellness"),grab("/api/load")]);
  S.wellness=w; S.charge=c; S.dataReady=true; recordHistory(); render();
}
function boot(){
  document.querySelectorAll("#nav button[data-ic]").forEach(b=>{b.innerHTML=icon(b.dataset.ic);});
  render();
  loadData();
  fetch("/api/intervals-sync",{cache:"no-store"})
    .then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok)loadData();}).catch(()=>{});
  setInterval(loadData,30*60*1000);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
</body>
</html>
