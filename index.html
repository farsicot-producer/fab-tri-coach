<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching Triathlon 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E293E; --slate:#4E5C7E; --lime:#B8E36E; --lime-deep:#9CCB4F;
  --canvas:#F4F2ED; --card:#FFFFFF; --card-alt:#F3F1EA;
  --text-primary:#1E293E; --text-secondary:#5B6472; --text-disabled:#98A0AC;
  --border-subtle:#E7E4DC; --border-divider:#EFECE5; --track:#E4E2DB; --data-neutral:#DBDEE3;
  --on-dark-muted:#9AA6BE; --track-dark:#2B3855;
  --swim:#5E7CA6; --bike:#6B9A72; --run:#C08457; --ppg:#8878A8;
  --ok:#3FAE59; --warn:#D99A3C; --danger:#D2564C;
  --action-500:var(--lime); --action-600:var(--lime-deep);
  --state-success:var(--ok); --state-warning:var(--warn); --state-danger:var(--danger);
  --font-display:'Hanken Grotesk',system-ui,sans-serif; --font-body:'Hanken Grotesk',system-ui,sans-serif;
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-pill:999px;
  --shadow-card:0 6px 18px -14px rgba(30,41,62,.35);
  --surface-page:var(--canvas); --surface-card:#FBFAF7; --surface-card-alt:var(--card-alt); --surface-white:var(--card); --white:#FFFFFF;
  --navy-900:var(--ink); --navy-800:#131A25; --navy-700:#28394F; --navy-600:#33496B; --slate-500:var(--slate); --slate-300:#7C97C1;
  --action-500:var(--lime); --action-600:var(--lime-deep); --action-disabled:#DDE0E4; --action-50:#EEF0F4;
  --activity-swim:var(--swim); --activity-bike:var(--bike); --activity-run:var(--run); --activity-strength:var(--ppg);
  --radius-sm:12px; --radius-md:16px; --radius-lg:20px; --radius-pill:999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);font-family:var(--font-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;font-family:var(--font-body)}
a{color:var(--text-secondary);text-decoration:none}
code{font-family:ui-monospace,monospace;font-size:.9em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.shell{min-height:100vh;display:flex;justify-content:center;background:var(--canvas)}
.col{width:100%;max-width:440px;min-height:100vh;background:transparent;position:relative;padding-bottom:104px}
.screen{padding:20px 16px 8px}
.hidden{display:none!important}

.h1{font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--text-primary)}
.h-card{font-weight:800;font-size:15px;color:var(--text-primary)}
.sect{font-weight:800;font-size:16px;color:var(--text-primary);margin:22px 2px 12px;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;color:var(--text-disabled);text-transform:uppercase;letter-spacing:.1em}
.sub{font-size:13px;color:var(--text-secondary);line-height:1.5}

/* hero deux tons */
.hero{border-radius:var(--r-lg);overflow:hidden;background:var(--ink);box-shadow:0 18px 40px -24px rgba(30,41,62,.5);margin-bottom:22px}
.hero-top{background:var(--slate);padding:28px 20px;position:relative;z-index:1;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:165px;border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--r-lg);box-shadow:0 3px 6px -1px rgba(255,255,255,.2),0 8px 17px -4px rgba(255,255,255,.2)}
.hero-logo{position:absolute;top:50%;right:14px;transform:translateY(-50%);opacity:.9}
.hero-eyebrow{font-size:14px;font-weight:700;color:#fff}
.hero-title{font-weight:800;font-size:28px;color:#fff;line-height:1.03;letter-spacing:-.02em;margin-top:8px;max-width:66%}
.hero-feu{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 14px 8px 10px;border:0;border-radius:var(--r-pill);background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13.5px;line-height:1.3;text-align:left;cursor:pointer;max-width:66%}
.hero-feu i{flex:none;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.hero-feu small{font-weight:500;color:var(--on-dark-muted)}
.prio{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:var(--r-pill);font-size:11px;font-weight:700;vertical-align:1px}
.prio.cle{background:var(--ink);color:var(--lime)}.prio.facultative{background:var(--card-alt);color:var(--text-secondary)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}.daychips button{flex:1;min-width:38px;padding:9px 0;border-radius:var(--r-sm);border:1px solid var(--border-subtle);background:var(--card);font-weight:700;font-size:13px;color:var(--text-secondary);cursor:pointer}
.daychips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.slotnote{font-size:12.5px;color:var(--text-secondary);margin-top:8px;line-height:1.45}
.flash{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:13px 14px;margin-bottom:16px;font-size:14px;line-height:1.45;font-weight:600}
.flash span{flex:1}.flash button{border:0;background:transparent;color:var(--on-dark-muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.pausec .pt{font-size:17px;font-weight:800;margin-top:6px}
.card.sundayc{display:flex;align-items:center;gap:12px;background:var(--ink);border-color:var(--ink);color:#fff;cursor:pointer;margin-top:22px}.sundayc>div{flex:1}.sundayc .st{font-size:16px;font-weight:800;margin-top:4px}.sundayc .ss{font-size:13px;color:var(--on-dark-muted);margin-top:2px}.sundayc svg{width:20px;height:20px}
.modal-back.sheetback{align-items:flex-end;padding:0}.sheet{background:var(--canvas);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(30,41,62,.5)}
.sopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.sopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:13px 14px;cursor:pointer}
.sopt b{font-size:15px;color:var(--text-primary)}.sopt span{font-size:13px;color:var(--text-secondary)}
.imp-btn{width:100%;margin-top:10px;background:transparent!important;border:1px dashed var(--slate)!important;color:var(--slate)!important}
.effort{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.effort button{padding:10px 0;border-radius:10px;border:1px solid var(--border-subtle);background:var(--card);font-weight:700;font-size:14px;color:var(--text-secondary);cursor:pointer}
.effort button.hi{border-color:rgba(210,86,76,.35)}.effort button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.adjnote{background:rgba(78,92,126,.08);border:1px solid rgba(78,92,126,.22);border-radius:var(--r-md);padding:13px 14px;font-size:14px;line-height:1.45;color:var(--text-primary)}.adjnote b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:3px}
.abadge.dropped{opacity:.55}.abadge.dropped .at{text-decoration:line-through}.st-dropped{background:var(--card-alt);color:var(--text-disabled)}
.prio.adj{background:rgba(78,92,126,.12);color:var(--slate)}
.dtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-pill);margin-right:4px;vertical-align:1px}
.dtag.mes{background:rgba(107,154,114,.16);color:#3F7A4C}.dtag.dec{background:rgba(192,132,87,.16);color:#9A5F33}.dtag.int{background:rgba(78,92,126,.14);color:var(--slate)}
.bl{font-size:14px;line-height:1.5;color:var(--text-secondary);margin-top:10px}
.brows{margin-top:14px;border-top:1px solid var(--border-divider)}.brow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--border-divider);font-size:13.5px;cursor:pointer}
.brow .bd{width:30px;font-weight:700;color:var(--text-disabled)}.brow .bn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .bs{color:var(--text-secondary);white-space:nowrap}
.bdot{width:9px;height:9px;border-radius:50%;flex:none}.bdot.done{background:var(--ok)}.bdot.z2{background:var(--warn)}.bdot.missed{background:var(--danger)}.bdot.dropped{background:var(--data-neutral)}.bdot.todo{background:transparent;border:1.5px solid var(--text-disabled)}
.decision{margin-top:16px;background:var(--card-alt);border-radius:var(--r-md);padding:14px}.decision .dl{font-size:17px;font-weight:800;margin:4px 0 4px}.dok{margin-top:10px;font-weight:800;color:#2F8A47}
.evo{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-divider)}.evo .et{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px}.evo .et b{font-size:22px}.evo .ex{font-size:13px;color:var(--text-secondary);line-height:1.45;margin-top:4px}
.adjr{padding:12px 0;border-top:1px solid var(--border-divider)}.adjr:first-of-type{border-top:0}.adjr .aw{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}.adjr .aw span{color:var(--text-disabled);font-weight:600;white-space:nowrap}.adjr .am{font-size:13.5px;color:var(--text-secondary);line-height:1.45;margin:4px 0 8px}
.cta.sm{height:36px;font-size:13px;flex:none;padding:0 14px;width:auto;display:inline-flex}
.reperes summary{font-weight:800;font-size:15px;cursor:pointer}
.hero-bot{background:var(--ink);padding:28px 20px;color:#fff;display:flex;flex-direction:column;justify-content:center;min-height:235px}
.hero-metric{display:flex;align-items:baseline;gap:8px}
.hero-metric .big{font-size:40px;font-weight:800;line-height:.9}
.hero-metric .of{font-size:17px;font-weight:500;color:var(--on-dark-muted)}
.hero-sub{margin-top:10px;font-size:15px;color:var(--on-dark-muted)}
.hero-bar{margin-top:16px;height:11px;border-radius:99px;background:var(--track-dark);overflow:hidden}
.hero-bar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.hero-legend{display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:15px;color:var(--on-dark-muted)}
.hero-legend .val{font-size:16px;font-weight:800;color:#fff}

/* bandeau course cible */
.race{margin-bottom:14px;display:flex;align-items:center;gap:13px;background:rgba(192,132,87,.10);border:1px solid rgba(192,132,87,.28);border-radius:var(--r-md);padding:14px}
.race .flag{width:42px;height:42px;border-radius:12px;background:rgba(192,132,87,.16);display:grid;place-items:center;flex:none;color:var(--run)}
.race .info{flex:1;min-width:0}
.race .re{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--run)}
.race .rn{font-size:16px;font-weight:800;margin-top:2px;line-height:1.1}
.race .rd{font-size:13px;color:var(--text-secondary);margin-top:2px}
.race .cd{flex:none;text-align:center;background:var(--run);color:#fff;border-radius:12px;padding:8px 12px}
.race .cd .big{font-size:18px;font-weight:800;line-height:1}
.race .cd .small{font-size:10px;font-weight:700;opacity:.9;margin-top:3px}

/* cartes */
.card{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px}
.card+.card{margin-top:14px}
.card-sm{border-radius:var(--r-md)}

/* section header ligne */
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sechead h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sechead a{font-size:13px;font-weight:600;color:var(--text-secondary)}

/* lignes séance */
.sess{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:13px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card);cursor:pointer;position:relative}
.row.is-done{background:#FAFBF8}
.row.is-done .rt h4{color:var(--text-secondary)}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.chip svg{width:20px;height:20px}
.chip .badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:2px solid var(--card)}
.chip .badge svg{width:10px;height:10px;stroke:#fff}
.rt{flex:1;min-width:0}
.rt h4{font-size:15px;font-weight:700;line-height:1.15}
.rt .meta{font-size:13px;color:var(--text-secondary);margin-top:3px}
.when{font-size:12px;font-weight:600;color:var(--text-disabled);text-align:right;white-space:nowrap}
.when .d{display:block;color:var(--text-primary);font-weight:700}

/* pastilles statut */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:5px 11px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.st-todo{border:1px solid var(--border-subtle);color:var(--text-secondary);background:var(--card)}
.st-done{background:rgba(63,174,89,.14);color:#2F8A47}
.st-missed{background:rgba(210,86,76,.12);color:#B4453C}
.st-adapt{background:rgba(30,41,62,.08);color:var(--ink)}

/* graphe monochrome + pic */
.pbar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;margin-top:18px}
.bars .col2{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:9px;cursor:pointer}
.bars .bar{width:100%;border-radius:7px 7px 4px 4px;background:var(--data-neutral)}
.bars .g{width:16px;height:16px;color:var(--text-disabled)}

/* progression blocs */
.blocks4{display:flex;gap:10px}
.blocks4 .b{flex:1}
.blocks4 .bn{font-size:12px;font-weight:800;color:var(--ink)}
.blocks4 .bs{font-size:10.5px;font-weight:600;color:var(--text-disabled);line-height:1.2;margin-top:2px;min-height:25px}
.blocks4 .bt{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.blocks4 .bt>i{display:block;height:100%;background:var(--lime);border-radius:99px}
.blocks4 .b.on .bt{outline:2px solid rgba(184,227,110,.5);outline-offset:1px}
.blocks4 .bp{font-size:12px;color:var(--text-disabled);font-weight:600}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;border:1px solid transparent;min-height:48px}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime);box-shadow:0 14px 30px -18px rgba(156,203,79,.7)}
.btn.secondary{background:var(--card);color:var(--text-primary);border-color:var(--border-subtle)}
.btn.ghost{background:transparent;color:var(--text-secondary)}
.btn.block{width:100%}
.btn.left{justify-content:flex-start;text-align:left}

/* segmented */
.seg{display:flex;background:var(--card);border:1px solid var(--border-subtle);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:10px;font-size:15px;font-weight:700;color:var(--text-secondary);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}

/* pills semaine -> grille */
.pills{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:4px}
.pills button{width:100%;aspect-ratio:1;border-radius:50%;border:1px solid var(--border-subtle);background:var(--card);color:var(--text-secondary);font-weight:700;font-size:14px;cursor:pointer;display:grid;place-items:center}
.pills button.on{border-color:var(--lime);background:var(--lime);color:var(--ink);font-weight:800}

/* activity badge (calendrier) */
.abadge{position:relative;background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:13px;display:flex;align-items:center;gap:13px;cursor:pointer}
.abadge.is-done{background:#FAFBF8}
.abadge .ai{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.abadge .ai svg{width:20px;height:20px}
.abadge .ai .badge{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:2px solid var(--card)}
.abadge .ai .badge svg{width:10px;height:10px;stroke:#fff}
.abadge .ab{flex:1;min-width:0}
.abadge .at{font-size:15px;font-weight:700}
.abadge .as{font-size:13px;color:var(--text-secondary);margin-top:2px}
.day-rest{padding:14px 4px;font-size:15px;color:var(--text-disabled);font-weight:500}

/* liste semaines */
.wk{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow-card);cursor:pointer}
.wk .n{font-size:15px;font-weight:800}
.wk .b{font-size:12px;color:var(--text-secondary);margin-top:2px}
.wk .dots{display:flex;gap:5px;margin-top:8px}
.wk .dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.wk .cnt{font-size:14px;font-weight:800;color:var(--text-disabled);white-space:nowrap}
.wk.cur{border-color:rgba(184,227,110,.7);box-shadow:0 8px 20px -14px rgba(30,41,62,.4),inset 0 0 0 1px rgba(184,227,110,.5)}

/* menu rows */
.menu{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mrow{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:15px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow-card);cursor:pointer}
.mrow .mi{width:34px;height:34px;border-radius:10px;background:var(--card-alt);display:grid;place-items:center;flex:none;color:var(--ink)}
.mrow .mi svg{width:18px;height:18px}
.mrow .ml{flex:1;font-size:15px;font-weight:700;color:var(--text-primary)}
.mrow .mc{color:var(--text-disabled);display:flex}
.mrow .mc svg{width:18px;height:18px}
.mrow.danger .mi{background:rgba(210,86,76,.10);color:var(--danger)}
.mrow.danger .ml{color:var(--danger)}

/* champs */
.field{width:100%;background:var(--card-alt);border:1px solid var(--border-subtle);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--text-primary)}
.field::placeholder{color:var(--text-disabled)}
.flabel{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:7px}

/* détail (overlay) */
.ovl{position:fixed;inset:0;background:var(--canvas);z-index:100;overflow-y:auto;max-width:440px;margin:0 auto}
.ohead{background:var(--ink);padding:18px 18px 22px;color:#fff;border-radius:0 0 22px 22px}
.oback{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.10);display:grid;place-items:center;cursor:pointer;color:#fff}
.oback svg{width:20px;height:20px}
.o-eyebrow{font-size:13px;color:var(--on-dark-muted);margin-top:16px}
.o-title{font-weight:800;font-size:24px;margin-top:4px;letter-spacing:-.01em}
.o-facts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.o-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.o-pill svg{width:15px;height:15px}
.o-pill.done{background:rgba(63,174,89,.24);color:#CDEBD5}
.o-note{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:15px;font-size:15px;color:var(--text-secondary);line-height:1.5;box-shadow:var(--shadow-card);border-left:3px solid var(--lime)}
.step{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);padding:14px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow-card)}
.step .n{width:28px;height:28px;flex:none;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.step .st h4{font-size:15px;font-weight:700}
.step .st p{font-size:14px;color:var(--text-secondary);margin-top:3px;line-height:1.45}
.cta-lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-disabled);margin:0 2px 8px}
.cta-row{display:flex;gap:12px}
.cta{flex:1;height:54px;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:0}
.cta svg{width:18px;height:18px}
.cta.ghost{background:var(--card);color:var(--text-secondary);border:1px solid var(--border-subtle)}
.cta.done.sel{background:var(--ok);color:#fff}
.cta.miss.sel{background:var(--danger);color:#fff}
.cta.adapt.sel{background:var(--ink);color:#fff}
.ring{position:relative;flex:none}
.ring .rl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--text-primary)}

/* ppg */
.ppg{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px;display:flex;gap:14px;align-items:flex-start}
.ppg .pi{width:104px;height:104px;border-radius:14px;overflow:hidden;background:#ECEAE4;border:1px solid var(--border-subtle);display:grid;place-items:center;flex:none;color:var(--ppg);position:relative}
.ppg .pi svg{width:30px;height:30px;opacity:.7}
.ppg .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ppg .pc{flex:1;min-width:0}
.ppg .ptop{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px}
.ppg .ptop strong{font-size:16px;font-weight:800;flex-basis:100%}
.ppg .tag{font-size:12px;font-weight:700;color:var(--ppg);background:rgba(136,120,168,.14);padding:4px 10px;border-radius:99px;white-space:nowrap}
.ppg .pm{font-size:12px;color:var(--text-disabled);font-weight:600;margin-bottom:3px}
.ppg .pcue{font-size:13px;color:var(--text-secondary);line-height:1.45}

/* suivi data */
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sd-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.sd-badge i{width:7px;height:7px;border-radius:50%;background:var(--text-disabled);display:inline-block}
.sd-badge.ok i{background:var(--ok)}
.sd-badge.stale i{background:var(--warn)}
.sd-badge.down i{background:var(--danger)}
.sd-verdict{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.sd-verdict i.dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none}
.sd-vh{font-size:13px;font-weight:800}
.sd-vs{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.45}
.sd-br{display:flex;flex-direction:column;gap:12px}
.sd-b{background:var(--card-alt);border-radius:var(--radius-md);padding:14px 16px}
.sd-b h4{margin:0 0 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-disabled)}
.sd-stats{display:flex;flex-wrap:nowrap;align-items:flex-end;gap:10px}
.sd-stat{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:0 0 10px}
.sd-stat-l{font-size:11.5px;color:var(--text-secondary);line-height:1.15;min-height:0}
.sd-stat-v{font-size:28px;font-weight:800;line-height:1;color:var(--text-primary);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.sd-stat-u{font-size:.42em;font-weight:700;color:var(--text-disabled);margin-left:3px;letter-spacing:0}
.sd-pill{flex:0 0 auto;align-self:stretch;min-width:90px;border-radius:var(--radius-md);padding:10px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;color:#fff;text-align:center}
.sd-pill.na{background:var(--data-neutral);color:var(--text-secondary)}
.sd-pill-l{font-size:11.5px;font-weight:700;text-transform:lowercase;opacity:.92;line-height:1.15;white-space:nowrap}
.sd-pill-v{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sd-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border-subtle)}
.sd-row:first-of-type{border-top:0}
.sd-row:last-child{border-bottom:0}
.sd-row .l{font-size:12px;color:var(--text-secondary);white-space:pre-line;line-height:1.25}
.sd-row .v{font-size:14px;font-weight:800;text-align:right;white-space:nowrap}
.sd-row .d{font-weight:700;margin-left:3px;font-size:11px}
.sd-row .d.df{margin-left:0;margin-right:5px}
.tgt{margin-top:7px;font-size:12.5px;font-weight:700;color:var(--ink);background:rgba(30,41,62,.06);border-radius:8px;padding:5px 9px;display:inline-block;line-height:1.4}
.sd-empty{font-size:12px;color:var(--text-disabled);line-height:1.45}
.sd-med{margin-top:14px;border-radius:12px;padding:12px;background:var(--card);border:1px solid var(--border-subtle)}
.sd-med.on{background:rgba(210,86,76,.08);border-color:rgba(210,86,76,.4)}
.sd-med label{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:600;cursor:pointer}
.sd-med input{accent-color:var(--ink);width:18px;height:18px;margin-top:1px}
.sd-med p{font-size:11px;color:var(--text-disabled);margin:7px 0 0;line-height:1.4}

/* prochaine séance (addon triathlon-coach) */
.ns-sess{display:flex;gap:12px;align-items:flex-start}
.ns-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ns-ico svg{width:22px;height:22px}
.ns-name{font-size:16px;font-weight:800;line-height:1.25;color:var(--text-primary)}
.ns-meta{font-size:12px;color:var(--text-secondary);margin-top:3px}
.ns-was{font-size:11.5px;color:var(--text-disabled);margin-top:8px;line-height:1.4}
.ns-alt{font-size:12px;color:var(--text-secondary);margin-top:6px}
.ns-r{padding:8px 0;border-bottom:1px dashed var(--border-subtle)}
.ns-r:first-of-type{padding-top:0}
.ns-r:last-child{border-bottom:0;padding-bottom:0}
.ns-r .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ns-r .s{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ns-r .s i{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.ns-r .m{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.ns-r .lec{font-size:11.5px;color:var(--text-disabled);margin-top:3px;line-height:1.4}
.ns-notes{margin:10px 0 0;padding:0;list-style:none;font-size:12px;color:var(--text-secondary);line-height:1.45}
.ns-notes li{padding-left:12px;position:relative;margin-top:3px}
.ns-notes li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--text-disabled)}
.ns-more{margin-top:12px;border-top:1px solid var(--border-subtle);padding-top:10px}
.ns-more>summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.ns-more>summary::-webkit-details-marker{display:none}
.ns-more>summary::before{content:"▸";color:var(--text-disabled);transition:transform .15s}
.ns-more[open]>summary::before{transform:rotate(90deg)}
.ns-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ns-kpi{background:var(--card-alt);border-radius:10px;padding:8px 6px;text-align:center}
.ns-kpi .k{font-size:10.5px;color:var(--text-secondary);font-weight:600}
.ns-kpi .v{font-size:16px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.ns-gaps{margin:10px 0 0;padding-left:16px;font-size:11.5px;color:var(--text-secondary);line-height:1.5}
.ns-foot{font-size:11px;color:var(--text-disabled);margin-top:10px;line-height:1.4}

/* nav basse */
.navwrap{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:12px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:60}
.nav{width:100%;max-width:410px;pointer-events:auto;display:flex;justify-content:space-around;align-items:center;background:var(--ink);border-radius:22px;padding:8px;box-shadow:0 22px 44px -20px rgba(30,41,62,.6)}
.nav button{flex:1;border:0;background:transparent;color:#8B93A4;height:46px;border-radius:16px;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.nav button.on{background:var(--lime);color:var(--ink)}
.modal-back{position:fixed;inset:0;background:rgba(30,41,62,.45);z-index:120;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:360px;width:100%;box-shadow:0 30px 60px -20px rgba(30,41,62,.55)}
.modal-t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-disabled)}
.modal-m{font-size:16px;font-weight:600;margin-top:8px;line-height:1.4}
.modal-row{display:flex;gap:12px;margin-top:20px}
.modal-row .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ═══ Gélule routine (déclencheur dans le détail natation) ═══ */
.rt-open{width:100%;text-align:left;background:var(--card);border:1px solid var(--border-subtle);border-left:3px solid var(--swim);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:14px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;font-family:inherit}
.rt-open .ic{width:40px;height:40px;flex:none;border-radius:11px;background:rgba(94,124,166,.12);display:grid;place-items:center;color:var(--swim)}
.rt-open .ic svg{width:22px;height:22px}
.rt-open .tx{flex:1}
.rt-open .tx h4{margin:0;font-size:15px;font-weight:800;color:var(--text-primary)}
.rt-open .tx p{margin:3px 0 0;font-size:13px;color:var(--text-secondary)}
.rt-open .chev{color:var(--text-disabled)}
.rt-open .chev svg{width:20px;height:20px}

/* ═══ Overlay routine (carrousel) ═══ */
.rovl{position:fixed;inset:0;background:var(--canvas);z-index:120;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
.rhead{background:var(--ink);padding:16px 18px;color:#fff;border-radius:0 0 20px 20px;flex:none}
.rhead .top{display:flex;align-items:center;justify-content:space-between}
.rhead .ttl{font-size:13px;color:var(--on-dark-muted);font-weight:600}
.rhead .eb{font-size:13px;color:var(--on-dark-muted);margin-top:12px}
.rprog{height:4px;background:var(--track-dark);border-radius:99px;margin-top:12px;overflow:hidden}
.rprog>i{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;transition:width .28s ease}
.rvp{flex:1;overflow:hidden;position:relative}
.rtrack{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.rslide{min-width:100%;height:100%;overflow-y:auto;padding:18px 16px 22px;-webkit-overflow-scrolling:touch}
.rcard{background:var(--card);border:1px solid var(--border-subtle);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
.reb{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--danger);text-transform:uppercase}
.rmeta{display:flex;gap:10px;margin-top:14px;justify-content:center}
.rmeta .m{text-align:center}
.rmeta .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-disabled);text-transform:uppercase}
.rmeta .v{margin-top:4px;font-size:15px;font-weight:700}
/* cover / note / list */
.rcover,.rnote{padding:26px 22px}
.rcover{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.rcover .reb,.rnote .reb{text-align:center;display:block}
.rcover h2{margin:10px 0 0;font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.01em;font-family:var(--font-display)}
.rcover hr,.rnote hr,.rlist hr{border:0;border-top:1px solid var(--border-divider);margin:18px 0}
.rcover .row{display:flex;gap:12px;justify-content:center;align-items:baseline;margin-top:12px;font-size:16px}
.rcover .row .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-disabled);text-transform:uppercase}
.rnote h3,.rlist h3{margin:8px 0 0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-align:center;font-family:var(--font-display)}
.rnote .it{font-size:15.5px;line-height:1.55;color:var(--text-secondary);margin:0 0 15px;text-align:center}
.rnote .it:last-child{margin-bottom:0}
.rnote .it b{color:var(--text-primary);font-weight:800}
.rnote.left .it{text-align:left}
.rlist{padding:24px 22px}
.rlist ul{list-style:none;margin:0;padding:0}
.rlist li{font-size:15.5px;line-height:1.5;color:var(--text-secondary);text-align:center;padding:11px 0;border-bottom:1px solid var(--border-divider)}
.rlist li:last-child{border-bottom:0}
.rlist .cp{margin-top:16px;padding-top:16px;border-top:1px solid var(--border-divider);text-align:center}
.rlist .cp .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text-disabled);text-transform:uppercase}
.rlist .cp .v{margin-top:6px;font-size:15px;font-weight:700;color:var(--text-primary)}
/* exercise */
.rex{overflow:hidden}
.rex .hd{padding:20px 22px 0}
.rex h3{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em;font-family:var(--font-display)}
.rex .img{margin:16px 0 0;background:#fff;border-top:1px solid var(--border-divider);border-bottom:1px solid var(--border-divider)}
.rex .img img{display:block;width:100%;height:auto}
.rex .ex{padding:18px 22px 0}
.rex .ex .lbl{font-size:11.5px;font-weight:700;letter-spacing:.13em;color:var(--text-disabled);text-transform:uppercase}
.rex .ex p{margin:9px 0 0;font-size:15.5px;line-height:1.5;color:var(--text-secondary)}
.rex .ft{display:flex;margin:20px 0 0;border-top:1px solid var(--border-divider)}
.rex .ft>div{flex:1;padding:15px 22px 20px}
.rex .ft>div+div{border-left:1px solid var(--border-divider)}
.rex .ft .k{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text-disabled);text-transform:uppercase}
.rex .ft .v{margin-top:5px;font-size:15px;font-weight:700;color:var(--text-primary)}
/* nav */
.rnav{flex:none;display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--canvas);border-top:1px solid var(--border-subtle)}
.rnav button{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--border-subtle);background:var(--card);color:var(--text-primary);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-card)}
.rnav button svg{width:22px;height:22px}
.rnav button[disabled]{opacity:.35;box-shadow:none;cursor:default}
.rdots{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.rdots .d{width:7px;height:7px;border-radius:50%;background:var(--data-neutral);cursor:pointer;transition:all .2s;border:1px solid #cfd3d9}
.rdots .d.on{background:var(--swim);border-color:var(--swim);width:22px;border-radius:99px}
</style>
</head>
<body>
<div class="shell"><div class="col">
  <div id="app"></div>
  <div class="navwrap" id="navwrap">
    <div class="nav" id="nav">
      <button data-v="overview" class="on" data-ic="house"></button>
      <button data-v="calendar" data-ic="calendar"></button>
      <button data-v="bilan" data-ic="chart" aria-label="Bilan"></button>
      <button data-v="settings" data-ic="gear"></button>
    </div>
  </div>
  <div id="overlay"></div>
</div></div>
<script>
"use strict";
/* ════════════ Icônes SVG inline (aucune dépendance externe) ════════════
   Activités : tracés repris du logo FA (natation, vélo, course).
   Menu / UI : jeu cohérent, trait 2px, currentColor.                     */
const _ic=(vb,body,sw)=>`<svg viewBox="${vb}" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" style="display:block;overflow:visible">${body}</svg>`;

const ICONS={
  /* ── activités (extraites du logo, recadrées) ── */
  swim:_ic("176 440 200 120",
    '<path d="M209 486C232 457 255 451 276 468c16 13 28 24 53 24"/><circle cx="344" cy="469" r="15"/>'+
    '<path d="M184 515c20 15 40-15 60 0s40 15 60 0 40-15 60 0"/>'+
    '<path d="M184 539c20 15 40-15 60 0s40 15 60 0 40-15 60 0"/>',9),
  bike:_ic("395 165 230 140",
    '<circle cx="445" cy="252" r="42"/><circle cx="579" cy="252" r="42"/>'+
    '<path d="M445 252 490 205 531 252 445 252"/><path d="M490 205h63l-22 47"/>'+
    '<path d="M553 205 579 252"/><path d="M478 187h21"/><path d="M553 205l-7-24h22"/>',11),
  run:_ic("700 425 155 175",
    '<circle cx="824" cy="448" r="15"/>'+
    '<path d="M744 480c20-25 34-29 49-5 14 21 25 25 44 7"/>'+
    '<path d="M790 482c-15 23-28 40-39 55l-36 36"/>'+
    '<path d="M751 537c26-1 40 7 49 21l-39 20"/>',11),
  strength:_ic("0 0 24 24",'<path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/>'),

  /* ── navigation ── */
  house:_ic("0 0 24 24",'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/>'),
  calendar:_ic("0 0 24 24",'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>'),
  sliders:_ic("0 0 24 24",'<path d="M3.5 7.5h11M18.5 7.5h2M3.5 16.5h3M10.5 16.5h10"/><circle cx="16.5" cy="7.5" r="2.2"/><circle cx="8.5" cy="16.5" r="2.2"/>'),
  gear:_ic("0 0 24 24",'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 12H2.1M21.9 12h-2.4M6.7 6.7 5 5M19 19l-1.7-1.7M6.7 17.3 5 19M19 5l-1.7 1.7"/>'),

  /* ── UI ── */
  list:_ic("0 0 24 24",'<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="17.5" r="1.1" fill="currentColor" stroke="none"/>'),
  caret:_ic("0 0 24 24",'<path d="M9.5 5.5 16 12l-6.5 6.5"/>'),
  back:_ic("0 0 24 24",'<path d="M14.5 5.5 8 12l6.5 6.5"/><path d="M8 12h11" opacity=".9"/>'),
  reset:_ic("0 0 24 24",'<path d="M3.8 12a8.2 8.2 0 1 0 2.6-6"/><path d="M3.4 4.6v4.2h4.2"/>'),
  moon:_ic("0 0 24 24",'<path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/>'),
  chart:_ic("0 0 24 24",'<path d="M3.5 19.5V4.5M3.5 19.5h16"/><path d="M7 15l3.6-4.4 3.2 2.6L19 7"/>'),

  /* ── PPG ── */
  plank:_ic("0 0 24 24",'<circle cx="5.5" cy="9" r="1.8"/><path d="M7.5 10.5h11"/><path d="M9.5 10.5 8 16M15 10.5 16.5 16"/>'),
  side:_ic("0 0 24 24",'<circle cx="6" cy="6.5" r="1.8"/><path d="M7 8.5 14 17"/><path d="M14 17H6.5"/><path d="M10.5 12.8 17 9"/>'),
  bridge:_ic("0 0 24 24",'<path d="M4 17h16"/><path d="M7 17c0-4 2.6-6.5 5.5-6.5S18 13 18 17"/><circle cx="5" cy="13.5" r="1.6"/>'),
  birddog:_ic("0 0 24 24",'<circle cx="6" cy="8.5" r="1.7"/><path d="M7.6 10.2h7.6"/><path d="M15.2 10.2 20 7"/><path d="M8.6 10.2 6 16M15.2 10.2 18 16"/>'),
  lunge:_ic("0 0 24 24",'<circle cx="11.5" cy="4.8" r="1.8"/><path d="M11.5 6.8v5"/><path d="M11.5 11.8 7 18M11.5 11.8 16.5 16.5 19 18"/>'),
  calf:_ic("0 0 24 24",'<path d="M12 19V6"/><path d="M7.5 10.5 12 6l4.5 4.5"/><path d="M6.5 21h11"/>'),
  deadbug:_ic("0 0 24 24",'<circle cx="5.5" cy="12" r="1.8"/><path d="M7.5 12h9"/><path d="M10 12 8 6.5M14 12l2.5 5.5"/>'),
  hip90:_ic("0 0 24 24",'<circle cx="12" cy="12" r="8" stroke-dasharray="3.2 3"/><path d="M12 12h5M12 12V7"/>')
};
function icon(n){return ICONS[n]||ICONS.list;}
</script>
<script>
"use strict";
/* ════════════ Données — portées de la maquette ════════════ */
const DAY_NAMES=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const BLOCKS=[
 {key:"b1",name:"Bloc 1",title:"Rebuild aérobie",range:[1,8],goal:"Reconstruire sans fatigue • 80–90% Z2"},
 {key:"b2",name:"Bloc 2",title:"Seuil / FTP",range:[9,16],goal:"Sweet spot • VO2 contrôlée • 2 séances qualité max"},
 {key:"b3",name:"Bloc 3",title:"Spécifique tri",range:[17,24],goal:"Allure tri • enchaînements • simulations contrôlées"},
 {key:"b4",name:"Bloc 4",title:"Consolidation",range:[25,30],goal:"Garder la forme • plaisir • éviter le detraining"}
];
const SWIM_DATA={
 Propulsion:{goal:"Prise d'appui, propulsion, vitesse courte.",use:"Semaines de volume doux ou spécifique tri.",steps:["100m respi 2 temps + 50 dos + 50 brasse","100m respi 4 temps + 50 dos + 50 brasse","100m respi 6 temps + 50 dos + 50 brasse","Plaquettes + pull buoy : 4 × 500m progressifs avec 100m water-polo intégré","Vitesse : 50m grand chien, 100m crawl en accélération, 50m water-polo, 100m rapide","Récupération : 200m crawl / brasse / dos"]},
 Seuil:{goal:"Allure soutenue sans casser la récupération.",use:"Bloc 2 et bloc 3.",steps:["Échauffement : 400m crawl / brasse / dos","4 × éducatif : 100m dont 50 grand chien + 50 crawl, puis 100m dont 50 water-polo + 50 crawl","Transition : 200m crawl / brasse / dos","15 × 100m au seuil","Récupération : 200m crawl / brasse / dos"]},
 Alignement:{goal:"Technique de référence, posture et efficacité.",use:"Reprise, récupération ou semaine chargée.",steps:["Échauffement : 400m crawl / brasse / dos","200m focus placement tête","3 × 100m : 50 water-polo + 50 roulis","2 × 100m rattrapé","300m tuba avec arrêt tous les 3 temps","6 × 100m : 50 fréquence + 50 force","50m : 15 water-polo + 35 récupération","Récupération : 200m"]},
 Lactate:{goal:"Séance dure, à utiliser ponctuellement.",use:"Bloc 2/3, jamais proche d'un gros brick.",steps:["Échauffement : 400m crawl / brasse / dos","8 × 50m : 25 grand chien ou water-polo + 25 crawl","4 × 50m progressifs","200m 3 nages","4 blocs : 200m avec 25 max + 150 tempo + 25 max, 200m avec 100 max + 50 récupération + 50 max, 200m tempo","Récupération : 200m"]},
 Endurance:{goal:"Construire le volume en douceur.",use:"Séance longue aérobie.",steps:["Échauffement : 400m crawl / brasse / dos","10 × 300m alternant tuba, crawl, tuba + pull buoy et plaquettes","Récupération : 200m crawl / brasse / dos"]}
};
const RECOVERY_WEEKS=[4,8,12,16,20,24,28];
const SPORT_META={
 natation:{color:"var(--activity-swim)",icon:"swim"},
 cap:{color:"var(--activity-run)",icon:"run"},
 velo:{color:"var(--activity-bike)",icon:"bike"},
 ppg:{color:"var(--activity-strength)",icon:"strength"}
};
const SPORT_TINT={natation:"rgba(28,126,214,.12)",cap:"rgba(242,146,74,.12)",velo:"rgba(76,175,80,.12)",ppg:"rgba(155,107,214,.12)"};
const STATUS_META={done:{label:"Fait",color:"var(--state-success)"},missed:{label:"Raté",color:"var(--state-danger)"},z2:{label:"Facile",color:"var(--navy-900)"},"":{label:"À faire",color:"var(--text-secondary)"}};
const TYPE_LABELS={club:"Club",endurance:"Endurance",technique:"Technique",quality:"Qualité",mobility:"Mobilité",strength:"Force"};
const RULES=[
 {title:"1. Jamais deux jours durs de suite",desc:"Intensité course + intensité vélo doivent être séparées par 24–48h."},
 {title:"2. Réduire plutôt qu'arrêter",desc:"En fatigue : 30–45 min Z2 ou natation technique. Éviter les semaines à zéro."},
 {title:"3. Récupération toutes les 4 semaines",desc:"Semaine allégée à 55–65% du volume, fréquence conservée."},
 {title:"4. Continuité prioritaire",desc:"Le gain principal vient de la stabilité annuelle, pas de séances plus dures."}
];
const PPG_ITEMS=[
 {id:"plank",icon:"plank",title:"Planche",time:"45 sec",muscles:"Transverse, épaules, fessiers",cue:"Corps gainé, coudes sous les épaules, dos droit."},
 {id:"sideplank",icon:"side",title:"Planche latérale",time:"30 sec/côté",muscles:"Obliques, moyen fessier",cue:"Bassin haut, corps aligné, appui avant-bras et pied."},
 {id:"glutebridge",icon:"bridge",title:"Pont fessier",time:"15 reps",muscles:"Grand fessier, ischios",cue:"Pieds à plat, monter les hanches en contractant les fessiers."},
 {id:"birddog",icon:"birddog",title:"Bird dog",time:"12 reps/côté",muscles:"Lombaires, fessiers, épaules",cue:"Gainage neutre, étirer bras et jambe opposés sans vriller."},
 {id:"lunge",icon:"lunge",title:"Fente arrière",time:"8 reps/côté",muscles:"Quadriceps, fessiers, mollets",cue:"Buste haut, genou avant stable, descendre contrôlé."},
 {id:"calf",icon:"calf",title:"Mollets debout",time:"12 reps",muscles:"Soléaire, gastrocnémiens",cue:"Monter fort, redescendre lentement, garder l'appui du gros orteil."},
 {id:"deadbug",icon:"deadbug",title:"Dead bug",time:"10 reps/côté",muscles:"Transverse, fléchisseurs hanche",cue:"Lombaires stables, mouvement lent bras/jambe opposés."},
 {id:"hip90",icon:"hip90",title:"Mobilité 90/90",time:"8 reps/côté",muscles:"Hanches, rotateurs externes",cue:"Amplitude propre, respiration calme, pas de douleur."}
];
const RUN_Q=["3x6' seuil (r2')","3x7' seuil (r2')","3x8' seuil (r90\")","4x6' VO2 (r3')","4x8' seuil (r2')","5x5' seuil (r90\")","3x10' seuil (r2')","2x15' allure course"];
const BIKE_T=["3x10' tempo (r3')","3x12' tempo (r3')","4x8' seuil (r3')","4x10' seuil (r3')","3x15' seuil (r4')","2x20' seuil (r5')","5x5' VO2 (r4')","3x8' seuil (r3')"];

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMin=m=>{const h=Math.floor(m/60),mm=m%60;return h?`${h}h${String(mm).padStart(2,"0")}`:`${mm}min`;};
const blockForWeek=n=>BLOCKS.find(b=>n>=b.range[0]&&n<=b.range[1])||BLOCKS[0];
function swimKeyFor(name){const k=Object.keys(SWIM_DATA).find(k=>name.toLowerCase().includes(k.toLowerCase()));return k||(name.toLowerCase().includes("récup")?"Alignement":"Endurance");}
/* Créneaux : natation = club mardi et jeudi soir (fixe) ; course et PPG = à caler selon tes dispos ;
   vélo = samedi ou dimanche. Priorité : "cle" (rattrapée si possible, supprimée en dernier),
   "support" (réduite, jamais rattrapée), "facultative" (supprimée en premier). */
const PRIO={ // [natation, course, PPG, natation, vélo] — natation club : hors arbitrage (null)
 b1:[null,"support","support",null,"cle"],
 b2:[null,"support","support",null,"cle"],
 b3:[null,"cle","support",null,"cle"],
 b4:[null,"support","support",null,"support"]};
const PRIO_LABEL={cle:"Séance clé",support:"",facultative:"Facultative"};
const SLOT={natation:"club",cap:"libre",ppg:"libre",velo:"weekend"};
function buildWeek(n){
 const block=blockForWeek(n),idx=n-block.range[0],rec=RECOVERY_WEEKS.includes(n),mul=rec?0.6:1;
 const bs=55+idx*3,br=40+idx*4,bp=25+(idx%2)*5,bb=90+idx*8;
 const rq=block.key==="b3"&&!rec, bt=block.key==="b2"&&!rec;
 const brick=block.key==="b3"&&!rec&&idx%2===0, brickRun=idx>=4?20:15;
 const pr=rec?[null,"facultative","support",null,"facultative"]:PRIO[block.key];
 return [
  {id:`w${n}s0`,sport:"natation",name:idx%2?"Endurance souple":"Alignement technique",type:"technique",minutes:Math.round(bs*mul),day:1,prio:pr[0]},
  {id:`w${n}s1`,sport:"cap",name:rq?RUN_Q[idx]:`${Math.round(br*mul)}' Z2 continu`,type:rq?"quality":"endurance",minutes:Math.round(br*mul),day:0,prio:pr[1]},
  {id:`w${n}s2`,sport:"ppg",name:"Gainage + mobilité hanches",type:"mobility",minutes:Math.round(bp*mul),day:2,prio:pr[2]},
  {id:`w${n}s3`,sport:"natation",name:"Propulsion",type:"endurance",minutes:Math.round((bs-5)*mul),day:3,prio:pr[3]},
  brick?{id:`w${n}s4`,sport:"velo",name:`Enchaînement : vélo Z2 + ${brickRun}' course allure tri`,type:"quality",brick:brickRun,minutes:Math.round(bb)+brickRun,day:5,prio:pr[4]}
   :{id:`w${n}s4`,sport:"velo",name:rec?"Sortie Z2 récupération":(bt?BIKE_T[idx]:"Sortie longue Z2"),type:bt?"quality":"endurance",minutes:Math.round(bb*mul),day:5,prio:pr[4]}
 ];
}
function allFlat(){const o=[];for(let n=1;n<=30;n++)buildWeek(n).forEach(x=>o.push({...x,week:n}));return o;}
function sessionById(id){if(!id)return null;const m=id.match(/^w(\d+)s\d+$/);if(!m)return null;const w=Number(m[1]);const s=weekSessions(w).find(x=>x.id===id);return s?{week:w,session:s}:null;}
function ppgExercisesFor(s){
 const l=s.name.toLowerCase();let ids;
 if(l.includes("mobilité")&&l.includes("hanches"))ids=["hip90","plank","sideplank","deadbug"];
 else if(l.includes("fessiers"))ids=["glutebridge","lunge","plank","hip90"];
 else if(l.includes("mollets"))ids=["calf","plank","deadbug","hip90"];
 else if(l.includes("force"))ids=["lunge","glutebridge","calf","plank"];
 else if(l.includes("stabilité"))ids=["sideplank","birddog","glutebridge","deadbug"];
 else if(l.includes("mobilité"))ids=["hip90","deadbug","glutebridge"];
 else ids=["plank","sideplank","glutebridge","birddog"];
 return ids.map(i=>PPG_ITEMS.find(e=>e.id===i)).filter(Boolean);
}
function ppgCircuitFor(s){
 const l=s.name.toLowerCase();
 const neuro="Côté gauche (neuro) : reste dans l'amplitude propre, stoppe net si ça irradie ou fourmille. Mollets : contrôle l'excentrique, pas de rebond.";
 let tours=3,rest="45–60 s";
 if(l.includes("mobilité")&&l.includes("hanches")){tours=2;rest="30–45 s";}
 else if(l.includes("fessiers")){tours=3;rest="45–60 s";}
 else if(l.includes("mollets")){tours=3;rest="60 s";}
 else if(l.includes("force")){tours=3;rest="45–60 s";}
 else if(l.includes("stabilité")){tours=3;rest="45–60 s";}
 else if(l.includes("mobilité")){tours=2;rest="30–45 s";}
 return {tours,rest,note:neuro};
}
function detailSteps(s){
 if(s.sport==="natation"){const d=SWIM_DATA[swimKeyFor(s.name)];
  return [{title:"Objectif",desc:`${d.goal} ${d.use}`},...d.steps.map((x,i)=>({title:`${i+1}. ${i===0?"Échauffement":i===d.steps.length-1?"Retour au calme":"Bloc"}`,desc:x}))];}
 if(s.sport==="cap")return[{title:"Objectif CAP",desc:`Exécuter ${s.name} sans dérive excessive. Priorité à la foulée propre et à la fraîcheur.`},{title:"Échauffement",desc:"10–15 min Z1/Z2 + mobilisation chevilles/hanches. Ajouter 3 accélérations très progressives si séance qualité."},{title:"Corps de séance",desc:s.name},{title:"Retour au calme",desc:"8–10 min très facile. Si jambes lourdes : finir plus court, pas plus vite."}];
 if(s.sport==="velo"&&s.brick)return[{title:"Objectif",desc:"Habituer les jambes à courir après le vélo : c'est la séance la plus proche de la course."},{title:"Échauffement",desc:"15 min progressives, cadence souple."},{title:"Vélo",desc:"Sortie Z2, fin à cadence un peu plus haute (90+ tr/min) sur les 10 dernières minutes."},{title:"Transition",desc:"Moins de 5 min : chaussures, casquette, c'est reparti. Prépare ton matériel avant de partir."},{title:"Course",desc:s.brick+" min à allure tri : les 5 premières minutes plus lentes, foulée courte. Arrêt immédiat si le mollet tire."},{title:"Retour au calme",desc:"5 min de marche, puis boire et manger dans la demi-heure."}];
 if(s.sport==="velo")return[{title:"Objectif vélo",desc:"Construire puissance durable et endurance spécifique."},{title:"Échauffement",desc:"15 min progressives, cadence souple. Sur home trainer : 3 rampes de 30 sec."},{title:"Corps de séance",desc:s.name},{title:"Retour au calme",desc:"10 min Z1/Z2. Nutrition : boire régulièrement, surtout sur les sorties de plus de 2h."}];
 return [{title:"Objectif",desc:"Renforcer ce qui protège la course et le vélo : hanches, gainage, fessiers et mollets. Exécution lente, jamais à l'échec."}];
}
/* ── Zones perso (Réglages → cibles injectées dans les séances) ── */
function parsePaceSec(v){const m=/^\s*(\d{1,2}):([0-5]?\d)\s*$/.exec(String(v||""));if(!m)return null;const s=(+m[1])*60+(+m[2]);return s>0?s:null;}
function fmtPace(sec){sec=Math.round(sec);const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
const HR_PCT={z1:[.55,.65],z2:[.65,.75],z3:[.75,.82],z4:[.82,.89],z5:[.89,.97]};
const FTP_PCT={z1:[.45,.55],z2:[.56,.75],z3:[.76,.90],z4:[.91,1.05],z5:[1.06,1.20]};
const PACE_OFF={z1:[75,105],z2:[45,75],z3:[15,30],z4:[-5,5],z5:[-20,-8]};
function userZones(){const fc=parseInt(S.fcMax,10),ftp=parseInt(S.ftp,10),p=parsePaceSec(S.pace);return{fc:fc>0?fc:null,ftp:ftp>0?ftp:null,pace:p};}
function mainZone(s){const n=(s.name||"").toLowerCase();if(n.includes("vo2"))return"z5";if(n.includes("tempo"))return"z3";if(n.includes("seuil"))return"z4";if(n.includes("récup")||n.includes("recup"))return"z1";return s.type==="quality"?"z4":"z2";}
function zoneForStep(title,mz){const t=(title||"").toLowerCase();if(t.includes("échauff")||t.includes("echauff"))return"z2";if(t.includes("retour au calme")||t.includes("récup")||t.includes("recup"))return"z1";return mz;}
function targetStr(sport,zone){const z=userZones(),out=[];
  if(sport==="cap"){if(z.pace){const[a,b]=PACE_OFF[zone];out.push(`Allure ${fmtPace(z.pace+a)}–${fmtPace(z.pace+b)} /km`);}if(z.fc){const[a,b]=HR_PCT[zone];out.push(`FC ${Math.round(z.fc*a)} à ${Math.round(z.fc*b)} bpm`);}}
  else if(sport==="velo"){if(z.ftp){const[a,b]=FTP_PCT[zone];out.push(`Puissance ${Math.round(z.ftp*a)}–${Math.round(z.ftp*b)} W`);}if(z.fc){const[a,b]=HR_PCT[zone];out.push(`FC ${Math.round(z.fc*a)} à ${Math.round(z.fc*b)} bpm`);}}
  return out.join(" · ");}

/* ════════════ État ════════════ */
const LS="coaching-tri-v2";
const S={view:"overview",calendarMode:"Semaine",currentWeek:1,status:{},moves:{},detailId:null,
 fcMax:"",pace:"",ftp:"",raceName:"",raceDate:"",weeklyGoalHours:8,
 symptom:false, wellness:null, charge:null, confirm:null, routineOpen:false,
 next:null, nextKey:null, feel:"", dataReady:false,
 adj:[], rpe:{}, pause:null, hist:{}, bilanDone:{}, sheet:null, flash:null};
let routineIdx=0;
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||"{}"));}catch(e){}
function persist(){try{localStorage.setItem(LS,JSON.stringify({adj:S.adj,rpe:S.rpe,pause:S.pause,hist:S.hist,bilanDone:S.bilanDone,status:S.status,moves:S.moves,fcMax:S.fcMax,pace:S.pace,ftp:S.ftp,raceName:S.raceName,raceDate:S.raceDate,currentWeek:S.currentWeek}));}catch(e){}}
const statusOf=id=>S.status[id]||"";
function setStatus(id,st){if(st)S.status[id]=st;else{delete S.status[id];delete S.rpe[id];}persist();render();}
function setDay(id,d){const f=sessionById(id);if(!f)return;S.adj=S.adj.filter(o=>!(o.sid===id&&o.kind==="move"));if(d===f.session.day)delete S.moves[id];else S.moves[id]=d;persist();render();}
</script>
<script>
"use strict";
/* ════════════ Suivi data — seuils & état ════════════ */
const CLEARANCE_CARDIAQUE="2019-01-01", MOIS_CLEARANCE_MAX=12;
const SEUILS={sleep:{vert:6.5,orange:6.0},sleepDelta:{vert:-0.5,orange:-1.5},fcRepos:{vert:3,orange:5},fcTrend:{vert:3,orange:7},tsb:{vert:-10,orange:-25}};
const NIV={vert:0,orange:1,rouge:2,na:-1};
const pire=(a,b)=>NIV[a]>=NIV[b]?a:b;
const num=(n,d=1)=>n==null?"—":(Math.round(n*10**d)/10**d).toLocaleString("fr-FR");
const daysSince=iso=>Math.floor((Date.now()-new Date(iso))/864e5);
const LVLC={vert:"var(--state-success)",orange:"var(--state-warning)",rouge:"var(--state-danger)",na:"var(--text-disabled)"};

function sdRow(l,v,u,lvl,d,dFirst){
  const val=`${esc(v)}${u?" "+esc(u):""}`;
  const del=d?`<span class="d${dFirst?" df":""}" style="color:${LVLC[lvl]}">${esc(d)}</span>`:"";
  return `<div class="sd-row"><span class="l">${esc(l)}</span><span class="v">${dFirst?del+val:val+del}</span></div>`;
}
function sdStat(l,v,u){
  const unit=(u&&v!=="—")?`<span class="sd-stat-u">${esc(u)}</span>`:"";
  return `<div class="sd-stat"><div class="sd-stat-l">${esc(l)}</div><div class="sd-stat-v">${esc(v)}${unit}</div></div>`;
}
// invert=true pour une métrique où « monter » est mauvais (ex. FC repos) : positif → rouge.
function sdPill(l,value,invert,lvl){
  if(value==null||isNaN(value))
    return `<div class="sd-pill na"><div class="sd-pill-l">${esc(l)}</div><div class="sd-pill-v">—</div></div>`;
  const r=Math.round(value), good=invert?r<=0:r>=0;
  const bg=lvl?{vert:"#4E9E63",orange:"#D99A3C",rouge:"#D2564C"}[lvl]:(good?"#4E9E63":"#D2564C"), disp=(r>0?"+":"")+r;
  return `<div class="sd-pill" style="background:${bg}"><div class="sd-pill-l">${esc(l)}</div><div class="sd-pill-v">${esc(disp)}</div></div>`;
}
function buildRecup(){
  const d=S.wellness, L=[];
  if(!d||d.empty||(d.sleep_h==null&&d.resting_hr==null))
    return {levels:L,html:`<div class="sd-empty">Aucune donnée de bien-être. Lance <code>/api/intervals-sync</code> puis vérifie la connexion Garmin dans intervals.icu.</div>`,state:"down",label:"Récup — aucune donnée"};
  const sl=typeof d.sleep_h==="number"?d.sleep_h:null, bsl=typeof d.sleep_baseline_7d==="number"?d.sleep_baseline_7d:null;
  const hr=typeof d.resting_hr==="number"?d.resting_hr:null, bhr=typeof d.resting_hr_baseline_7d==="number"?d.resting_hr_baseline_7d:null;
  const tr=typeof d.resting_hr_trend_7d==="number"?d.resting_hr_trend_7d:null;
  // Niveaux conservés pour le verdict « le plus conservateur gagne », même si non affichés en direct.
  let lvl=sl==null?"na":sl>=SEUILS.sleep.vert?"vert":sl>=SEUILS.sleep.orange?"orange":"rouge"; if(lvl!=="na")L.push(lvl);
  let hrDelta=null;
  if(sl!=null&&bsl!=null){const del=Math.round((sl-bsl)*10)/10; L.push(del<SEUILS.sleepDelta.orange?"rouge":del<SEUILS.sleepDelta.vert?"orange":"vert");}
  if(hr!=null&&bhr!=null){hrDelta=Math.round((hr-bhr)*10)/10; L.push(hrDelta>SEUILS.fcRepos.orange?"rouge":hrDelta>SEUILS.fcRepos.vert?"orange":"vert");}
  if(tr!=null)L.push(tr>SEUILS.fcTrend.orange?"rouge":tr>SEUILS.fcTrend.vert?"orange":"vert");
  const stats=sdStat("Sommeil",sl==null?"—":num(sl,1),"h")
    +sdStat("Suivi sommeil",bsl==null?"—":num(bsl,1),"h")
    +sdStat("FC repos",hr==null?"—":num(hr,0),"bpm");
  const html=`<div class="sd-stats">${stats}${sdPill("Tendance",hrDelta==null?null:-hrDelta)}</div>`;
  return {levels:L,html,state:"ok",label:"Récup à jour"};
}
function buildCharge(){
  const s=S.charge, L=[];
  if(!s||s.empty)
    return {levels:L,html:`<div class="sd-empty">Aucune activité reçue. Lance <code>/api/intervals-sync</code> et vérifie que Garmin envoie tes séances vers intervals.icu.</div>`,state:"down",label:"Charge — aucune donnée"};
  const p=s.pmc||{};
  const tsb=typeof p.tsb==="number"?p.tsb:null;
  const tsbLvl=tsb==null?null:tsb<SEUILS.tsb.orange?"rouge":tsb<SEUILS.tsb.vert?"orange":"vert";
  if(tsbLvl)L.push(tsbLvl);
  const stats=sdStat("Charge (7 j)",s.load7==null?"—":num(s.load7,0),"")
    +sdStat("Condition physique",p.ctl==null?"—":num(p.ctl,1),"")
    +sdStat("Fatigue récente",p.atl==null?"—":num(p.atl,1),"");
  const html=`<div class="sd-stats">${stats}${sdPill("Fraîcheur",tsb,false,tsbLvl)}</div>`;
  const last=s.lastActivity||{};
  const state=s.updatedAt&&daysSince(s.updatedAt)>3?"stale":"ok";
  return {levels:L,html,state,label:last.date?"Charge · "+new Date(last.date+"T00:00:00").toLocaleDateString("fr-FR"):"Charge à jour"};
}
function formeDuJour(){
  const R=buildRecup(), C=buildCharge();
  const clearOld=daysSince(CLEARANCE_CARDIAQUE)>MOIS_CLEARANCE_MAX*30;
  let lvl=R.levels.concat(C.levels).reduce((a,c)=>pire(a,c),"na");
  let head,sub,court;
  if(S.symptom){lvl="rouge";head="Stop — cap médical actif";court="Stop · repos";
    sub="Douleur neuro / mollet gauche aujourd'hui. Repos ou mobilité sans douleur, rien d'autre.";}
  else if(lvl==="na"){head="Pas de données — juge à la sensation";court=S.dataReady?"Pas de données · écoute tes sensations":"Lecture de tes données…";
    sub="Aucun signal reçu aujourd'hui. Cale l'intensité sur ton ressenti.";}
  else{
    const M={vert:["Feu vert — exécute le plan","Tout est bon. Fais la séance prévue, intensité comprise.","Feu vert · fais la séance prévue"],
      orange:["Feu orange — allège 10–15 %","Un signal n'est pas bon. Garde le volume, enlève l'intensité.","Feu orange · allège la séance"],
      rouge:["Feu rouge — Z1–Z2 courte ou repos","Un signal est au rouge. Consulte si ça dure 3 à 5 jours.","Feu rouge · repos ou très facile"]};
    [head,sub,court]=M[lvl];

/* ════════════ Prochaine séance — addon triathlon-coach ════════════
   Backend : /api/next-session (netlify/functions/next-session.mjs).
   Le front envoie la séance PRÉVUE ; le serveur renvoie maintenir / alléger /
   remplacer / repos. Le verdict Suivi data est transmis : le plus prudent gagne. */
const NS_DEC={maintenir:["Maintenir","exécute la séance prévue"],alleger:["Alléger","même séance, moins de charge"],
  remplacer:["Remplacer","récupération active à la place"],repos:["Repos","priorité à la récupération"]};
const NS_ZONE={z1:"Z1 récupération",z2:"Z2 endurance",z3:"Z3 tempo",z4:"Z4 seuil",z5:"Z5 VO2"};
const DAY_FULL=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
function suiviLevel(){const R=buildRecup(),C=buildCharge();return R.levels.concat(C.levels).reduce((a,c)=>pire(a,c),"na");}
function nextPlanned(){
  const td=(new Date().getDay()+6)%7;
  for(const w of [S.currentWeek,S.currentWeek+1]){
    if(w>30)break;
    const list=weekSessions(w).filter(x=>!x.dropped&&!statusOf(x.id)).sort((a,b)=>a.dayEff-b.dayEff);
    const f=w===S.currentWeek?list.find(x=>x.dayEff>=td):list[0];
    if(f)return {...f,week:w,offset:w===S.currentWeek?f.dayEff-td:7-td+f.dayEff};
  }
  return null;
}
function nsWhen(p){const d=p.offset===0?"Aujourd'hui":p.offset===1?"Demain":DAY_FULL[p.dayEff][0].toUpperCase()+DAY_FULL[p.dayEff].slice(1);
  return p.week!==S.currentWeek?d+" (sem. "+p.week+")":d;}
function nsKey(){const p=nextPlanned();if(!p)return "none";
  return [p.id,p.minutes,S.symptom?1:0,S.feel,suiviLevel(),S.fcMax,S.pace,S.ftp].join("|");}
let nsTimer=null;
function ensureNext(){const k=nsKey();if(k===S.nextKey)return;S.nextKey=k;S.next=null;clearTimeout(nsTimer);nsTimer=setTimeout(fetchNext,200);}
async function fetchNext(){
  const key=S.nextKey, p=nextPlanned();
  if(!p){S.next={ok:true,none:true};render();return;}
  const prm=new URLSearchParams({sport:p.sport,type:p.type,minutes:String(p.minutes),name:p.name,zone:mainZone(p),id:p.id});
  if(READ_TOKEN)prm.set("token",READ_TOKEN);
  if(S.fcMax)prm.set("fcmax",S.fcMax); if(S.ftp)prm.set("ftp",S.ftp); if(S.pace)prm.set("pace",S.pace);
  if(S.symptom)prm.set("symptom","1");

  if(S.feel==="fatigue")prm.set("feel","fatigue");

  catch(_){j={ok:false,error:"Réseau indisponible"};}

/* ════════════ Moteur d'adaptation ════════════
   Plan de référence (buildWeek, jamais modifié) + journal d'ajustements S.adj
   = plan effectif (weekSessions). Chaque ajustement porte son motif et s'annule.
   Règle : le plus prudent gagne ; le moteur allège, déplace ou retire, il n'ajoute jamais. */
const EXPECTED_EFFORT={club:5,endurance:4,technique:4,mobility:3,quality:7,strength:4};
const DAY_LONG=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const round5=m=>Math.max(10,Math.round(m/5)*5);
const todayIdx=()=>(new Date().getDay()+6)%7;
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDate=iso=>new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
function applyReduce(x,pct,easy){
  x.minutes=round5(x.minutes*(1-pct/100));
  if(easy&&x.type==="quality"){x.type="endurance";
    x.name=x.sport==="cap"?`${x.minutes}' Z2 continu`:x.brick?"Sortie Z2 souple (sans course)":"Sortie Z2 souple";x.brick=0;}
}
function weekSessions(n){
  const base=buildWeek(n).map(x=>({...x,week:n,dayEff:S.moves[x.id]??x.day}));
  const map=Object.fromEntries(base.map(x=>[x.id,x]));
  for(const op of S.adj){
    if(op.week!==n)continue;
    if(op.kind==="weekReduce"){
      base.forEach(x=>{if(x.sport==="natation")return;applyReduce(x,op.pct,op.noKey);
        if(op.noKey&&x.prio==="cle")x.prio="support";x.adjMotif=op.motif;x.adjOp=op.id;});
      continue;}
    const x=map[op.sid]; if(!x)continue;
    if(op.kind==="move")x.dayEff=op.day;
    else if(op.kind==="reduce")applyReduce(x,op.pct,op.easy);
    else if(op.kind==="drop")x.dropped=true;
    else if(op.kind==="replace")Object.assign(x,{name:op.name,minutes:op.minutes,type:op.type});
    if(op.day!=null&&op.kind!=="move")x.dayEff=op.day;
    if(op.kind!=="advance"){x.adjMotif=op.motif;x.adjOp=op.id;}
  }
  return base;
}
const activeSessions=n=>weekSessions(n).filter(x=>!x.dropped);
function addOp(op){op.id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);op.ts=Date.now();S.adj.push(op);persist();return op;}
function undoOp(id){
  const op=S.adj.find(o=>o.id===id); if(!op)return;
  S.adj=S.adj.filter(o=>o.id!==id);
  if(op.prevStatus)Object.assign(S.status,op.prevStatus);
  if(op.prevWeek!=null)S.currentWeek=op.prevWeek;
  if(op.bilanWeek!=null)delete S.bilanDone[op.bilanWeek];
  persist();
}
function weekStatuses(n){const o={};buildWeek(n).forEach(x=>{if(S.status[x.id])o[x.id]=S.status[x.id];});return o;}
function clearWeekStatuses(n){buildWeek(n).forEach(x=>{delete S.status[x.id];delete S.rpe[x.id];});}
const isHard=s=>!s.dropped&&s.type==="quality";
function hardAround(ws,d,exceptId){return ws.some(o=>o.id!==exceptId&&isHard(o)&&Math.abs(o.dayEff-d)<=1);}

/* Séance manquée : règles par sport et par priorité. earliest = premier jour possible pour la replacer. */
function missed(s,earliest,src){
  const n=s.week, ws=weekSessions(n), base={week:n,sid:s.id,src:src||"imprevu"};
  if(s.sport==="natation")
    return addOp({...base,kind:"drop",motif:"Séance club manquée : on ne la rattrape pas."});
  if(s.sport==="ppg"){
    const host=ws.filter(o=>!o.dropped&&o.id!==s.id&&o.dayEff>=earliest&&o.type!=="quality"&&o.sport!=="ppg"&&!statusOf(o.id)).sort((a,b)=>a.dayEff-b.dayEff)[0];
    if(host)return addOp({...base,kind:"replace",name:"Gainage express",minutes:15,type:"mobility",day:host.dayEff,
      motif:`PPG manquée : 15 min de gainage après ta séance de ${DAY_LONG[host.dayEff]}, pas de séance complète en dette.`});
    return addOp({...base,kind:"drop",motif:"PPG manquée : pas de séance facile d'ici dimanche pour y greffer 15 min de gainage. On passe."});
  }
  const isLong=s.sport==="velo"&&s.type!=="quality";
  if(s.type==="quality"||s.prio==="cle"){
    const allowed=s.sport==="velo"?[5,6]:[0,1,2,3,4,5,6];
    const cand=allowed.filter(d=>d>=earliest&&d<=Math.min(6,earliest+1)&&d!==s.dayEff);
    const d=cand.find(d=>s.type!=="quality"||!hardAround(ws,d,s.id));
    if(d!=null){
      if(isLong)return addOp({...base,kind:"reduce",pct:30,easy:false,day:d,
        motif:`Sortie longue décalée à ${DAY_LONG[d]}, à 70 % du volume : on ne rattrape pas tout.`});
      return addOp({...base,kind:"move",day:d,motif:`Séance clé décalée à ${DAY_LONG[d]} : la veille et le lendemain restent sans séance dure.`});
    }
    return addOp({...base,kind:"drop",motif:isLong?"Pas de créneau ce week-end : on passe à la semaine suivante sans empiler."
      :"Pas de créneau sous 48 h sans enchaîner deux séances dures : on ne rattrape pas, la suivante reste prioritaire."});
  }
  return addOp({...base,kind:"drop",motif:"Séance d'endurance manquée : on ne la rattrape pas. Reprends simplement la suivante."});
}
function imprevuMissed(id){
  const f=sessionById(id); if(!f)return;
  const s=f.session, base=s.week===S.currentWeek?Math.max(s.dayEff,todayIdx()):s.dayEff;
  const op=missed(s,base+1); S.flash=op.motif;
}
function imprevuShort(id){
  const f=sessionById(id); if(!f)return;
  const op=addOp({week:f.week,sid:id,src:"imprevu",kind:"reduce",pct:40,easy:false,
    motif:"Version courte (−40 %) : garde l'échauffement et le cœur de séance, coupe le volume."});
  S.flash=op.motif;
}
function imprevuAway(nDays){
  const td=todayIdx(), n=S.currentWeek, end=td+nDays-1;
  const hit=weekSessions(n).filter(x=>!x.dropped&&!statusOf(x.id)&&x.dayEff>=td&&x.dayEff<=end).sort((a,b)=>a.dayEff-b.dayEff);
  if(!hit.length){S.flash=`Aucune séance prévue sur ces ${nDays} jours : rien à changer.`;return;}
  const out=hit.map(s=>missed(s,end+1).motif);
  S.flash=`Absent ${nDays} jours : ${hit.length} séance${hit.length>1?"s":""} ajustée${hit.length>1?"s":""}. `+out[out.length-1]+(hit.length>1?" Le détail est dans Bilan › Ajustements.":"");
}
const PAUSE_LBL={vacances:"Vacances",malade:"Malade ou blessé"};
function startPause(reason){S.pause={reason,from:todayISO()};S.detailId=null;S.sheet=null;
  S.flash=reason==="vacances"?"Plan en pause. Fais le sport que tu veux : ce que ta montre enregistre compte dans ta charge.":"Plan en pause. Repos, et reprends quand tu n'as plus de symptôme.";persist();}
function endPause(){
  const p=S.pause; if(!p)return;
  const days=Math.max(0,daysSince(p.from)), ill=p.reason==="malade";
  const lvl=ill?(days<3?0:days<=7?1:2):(days<7?0:days<=14?1:2);
  S.pause=null;
  if(lvl===0){S.flash=`Pause de ${days} j : reprise telle que prévue.`;persist();return;}
  const target=lvl===2?Math.max(1,S.currentWeek-1):S.currentWeek;
  const op=addOp({week:target,kind:"weekReduce",pct:30,noKey:true,src:"reprise",prevWeek:S.currentWeek,prevStatus:weekStatuses(target),
    motif:lvl===2?`Reprise après ${days} j (${PAUSE_LBL[p.reason].toLowerCase()}) : on refait la semaine ${target} à −30 %, sans séance clé. La suite du plan est décalée d'une semaine.`
      :`Reprise après ${days} j (${PAUSE_LBL[p.reason].toLowerCase()}) : semaine à −30 %, sans séance clé.`});
  clearWeekStatuses(target); S.currentWeek=target; S.flash=op.motif; persist();
}

/* Effort ressenti : 2 séances de suite notées 2 points au-dessus du prévu → la prochaine séance clé est allégée. */
function expectedEffort(s){return EXPECTED_EFFORT[s.type]??4;}
function checkEffortDrift(){
  const rated=[];
  for(const w of [S.currentWeek-1,S.currentWeek]){if(w<1)continue;
    weekSessions(w).filter(x=>S.rpe[x.id]!=null).sort((a,b)=>a.dayEff-b.dayEff).forEach(x=>rated.push(x));}
  const last=rated.slice(-2);
  if(last.length<2||!last.every(x=>S.rpe[x.id]>=expectedEffort(x)+2))return;
  for(const w of [S.currentWeek,S.currentWeek+1]){if(w>30)break;
    const t=weekSessions(w).filter(x=>!x.dropped&&!statusOf(x.id)&&(w!==S.currentWeek||x.dayEff>=todayIdx())&&(x.prio==="cle"||x.type==="quality")).sort((a,b)=>a.dayEff-b.dayEff)[0];
    if(t){if(S.adj.some(o=>o.sid===t.id&&o.src==="auto"))return;
      const op=addOp({week:w,sid:t.id,src:"auto",kind:"reduce",pct:15,easy:true,
        motif:"Effort ressenti plus élevé que prévu sur tes 2 dernières séances : la prochaine séance clé passe en version allégée."});
      S.flash=op.motif;return;}
  }
}

/* Bilan de la semaine */
function bilanFor(n){
  const all=weekSessions(n), act=all.filter(x=>!x.dropped), dropped=all.filter(x=>x.dropped);
  const doneL=act.filter(x=>["done","z2"].includes(statusOf(x.id)));
  const minDone=doneL.reduce((a,x)=>a+x.minutes,0), minPlan=act.reduce((a,x)=>a+x.minutes,0);
  const td=todayIdx(), due=all.filter(x=>x.dayEff<=td), conf=due.length?Math.round(due.filter(x=>["done","z2"].includes(statusOf(x.id))).length/due.length*100):100, partial=td<6;
  const rated=all.filter(x=>S.rpe[x.id]!=null);
  const effAvg=rated.length?rated.reduce((a,x)=>a+S.rpe[x.id],0)/rated.length:null;
  const expAvg=rated.length?rated.reduce((a,x)=>a+expectedEffort(x),0)/rated.length:null;
  const felt=doneL.reduce((a,x)=>a+(S.rpe[x.id]||0)*x.minutes,0);
  const drift=rated.filter(x=>S.rpe[x.id]>=expectedEffort(x)+2).length;
  const p=(S.charge&&S.charge.pmc)||{}, tsb=typeof p.tsb==="number"?p.tsb:null, lvl=suiviLevel();
  let score=0; const why=[];
  if(lvl==="rouge"){score+=2;why.push("feu rouge ce matin");} else if(lvl==="orange"){score+=1;why.push("feu orange ce matin");}
  if(tsb!=null&&tsb<SEUILS.tsb.orange){score+=1;why.push("fraîcheur très basse");}
  if(drift>=2){score+=1;why.push("effort ressenti au-dessus du prévu");}
  let dec;
  if(n>=30)dec={key:"end",label:"Programme terminé",desc:"Les 30 semaines sont bouclées."};
  else if(conf<50&&due.length>=2&&!RECOVERY_WEEKS.includes(n))dec={key:"redo",label:`Refaire la semaine ${n}`,desc:"Moins de la moitié des séances prévues à ce jour sont faites : on consolide avant d'avancer."};
  else if(score>=2)dec={key:"light",label:`Semaine ${n+1} allégée (−20 %)`,desc:"Signaux de fatigue : "+why.join(", ")+"."};
  else dec={key:"next",label:`Passer à la semaine ${n+1}, telle que prévue`,desc:why.length?"Un signal à surveiller ("+why.join(", ")+"), pas assez pour alléger.":"Rien ne demande d'ajuster."};
  return {all,act,dropped,doneL,minDone,minPlan,conf,due,partial,effAvg,expAvg,felt,rated,tsb,dec};
}
function validateBilan(){
  const n=S.currentWeek, b=bilanFor(n), d=b.dec;
  if(d.key==="end")return;
  if(d.key==="redo"){addOp({week:n,kind:"advance",src:"bilan",bilanWeek:n,prevStatus:weekStatuses(n),motif:`Bilan semaine ${n} : on refait la semaine (moins de la moitié des séances faites).`});clearWeekStatuses(n);}
  else if(d.key==="light"){addOp({week:n+1,kind:"weekReduce",pct:20,noKey:false,src:"bilan",bilanWeek:n,prevWeek:n,motif:`Bilan semaine ${n} : semaine ${n+1} allégée de 20 % (fatigue).`});S.currentWeek=n+1;}
  else {addOp({week:n,kind:"advance",src:"bilan",bilanWeek:n,prevWeek:n,motif:`Bilan semaine ${n} : passage à la semaine ${n+1}, telle que prévue.`});S.currentWeek=n+1;}
  S.bilanDone[n]=d.key; S.flash=d.label+" : c'est enregistré."; persist();
}
function freshnessText(t){
  if(t==null)return "Pas de donnée de fraîcheur.";
  if(t>5)return "Tu es frais : la charge récente est plus basse que ce que tu encaisses d'habitude.";
  if(t>=SEUILS.tsb.vert)return "Équilibré : tu encaisses ta charge sans t'enfoncer.";
  if(t>=SEUILS.tsb.orange)return "Chargé, mais normal en semaine d'entraînement.";
  return "Fatigue accumulée élevée : il faut récupérer.";
}
function recordHistory(){
  const p=S.charge&&S.charge.pmc; if(!p||typeof p.ctl!=="number")return;
  S.hist[todayISO()]={ctl:p.ctl,atl:p.atl,tsb:p.tsb};
  const keys=Object.keys(S.hist).sort(); while(keys.length>90)delete S.hist[keys.shift()];
  persist();
}

function sparkline(vals,color){

}

function screenCalendar(){
  const block=blockForWeek(S.currentWeek), ws=weekSessions(S.currentWeek);
  let body="";
  if(S.calendarMode==="Semaine"){
    const pills=[];for(let n=block.range[0];n<=block.range[1];n++)pills.push(n);
    body=`<div style="margin-top:16px">
      <div style="font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:10px">${esc(block.name)} — ${esc(block.title)}</div>
      <div class="pills">${pills.map(n=>`<button data-act="week" data-arg="${n}" class="${n===S.currentWeek?"on":""}">${n}</button>`).join("")}</div>
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:18px">
      ${DAY_NAMES.map((nm,i)=>{
        const ss=ws.filter(x=>x.dayEff===i);
        return `<div><div class="eyebrow" style="margin-bottom:8px">${nm}</div>
          <div style="display:flex;flex-direction:column;gap:8px">
          ${ss.length?ss.map(s=>activityBadge(s,i)).join(""):`<div class="day-rest">Repos</div>`}
          </div></div>`;}).join("")}
      </div></div>`;
  } else {
    const rows=[];
    for(let n=1;n<=30;n++){
      const w=buildWeek(n), blk=blockForWeek(n);
      const done=w.filter(x=>["done","z2"].includes(statusOf(x.id))).length, tot=w.length;
      const dots=w.map(x=>{const ds=statusOf(x.id),on=(ds==="done"||ds==="z2");
        return `<i style="background:${SPORT_META[x.sport].color};opacity:${on?1:.32}"></i>`;}).join("");
      const cc=done===0?"var(--text-disabled)":(done>=tot?"#2F8A47":"var(--text-primary)");
      rows.push(`<div class="wk${n===S.currentWeek?" cur":""}" data-act="week-go" data-arg="${n}">
        <div><div class="n num">Semaine ${n}</div>
        <div class="b">${esc(blk.name)} — ${esc(blk.title)}</div>
        <div class="dots">${dots}</div></div>
        <div class="cnt num" style="color:${cc}">${done}/${tot}</div></div>`);
    }
    body=`<div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">${rows.join("")}</div>`;
  }
  return `<div class="screen"><div class="h1" style="margin-bottom:14px">Calendrier</div>
    ${seg(["Semaine","Liste"],S.calendarMode,"calmode")}${body}</div>`;
}

function mdBold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function routineSlide(p){
 if(p.kind==="cover")return `<div class="rslide"><div class="rcard rcover"><span class="reb">${esc(p.eyebrow)}</span><h2>${esc(p.title)}${p.sub?"<br>"+esc(p.sub):""}</h2><hr>${p.meta.map(m=>`<div class="row"><span class="k">${esc(m.k)}</span><span>${esc(m.v)}</span></div>`).join("")}</div></div>`;
 if(p.kind==="note")return `<div class="rslide"><div class="rcard rnote${p.align==="left"?" left":""}"><span class="reb">${esc(p.eyebrow)}</span><h3>${esc(p.title)}</h3><hr>${p.items.map(t=>`<p class="it">${mdBold(t)}</p>`).join("")}</div></div>`;
 if(p.kind==="list")return `<div class="rslide"><div class="rcard rlist"><span class="reb" style="text-align:center;display:block">${esc(p.eyebrow)}</span><h3>${esc(p.title)}</h3><hr><ul>${p.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${p.checkpoint?`<div class="cp"><div class="k">Checkpoint</div><div class="v">${esc(p.checkpoint)}</div></div>`:""}</div></div>`;
 return `<div class="rslide"><div class="rcard rex"><div class="hd"><div class="reb">${esc(p.phase)}</div><h3>${esc(p.num)} ${esc(p.title)}</h3></div>${p.img?`<div class="img"><img src="assets/routines/${p.img}.webp" alt="${esc(p.title)}" loading="lazy" onerror="this.parentNode.remove()"></div>`:""}<div class="ex"><div class="lbl">Exécution</div><p>${esc(p.exec)}</p></div><div class="ft"><div><div class="k">Dosage</div><div class="v">${esc(p.dosage)}</div></div><div><div class="k">Checkpoint</div><div class="v">${esc(p.checkpoint)}</div></div></div></div></div>`;

function overlayRoutine(){
 const n=ROUTINE_NATATION.length,i=Math.max(0,Math.min(n-1,routineIdx));
 return `<div class="rovl" id="rovl">
  <div class="rhead">
   <div class="top"><div class="oback" data-act="closeRoutine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="ttl">Étape ${i+1} / ${n}</div></div>

   <div class="rdots">${ROUTINE_NATATION.map((_,k)=>`<span class="d${k===i?" on":""}" data-act="routineDot" data-arg="${k}"></span>`).join("")}</div>

 </div>`;

function routineGo(i){
 const n=ROUTINE_NATATION.length;routineIdx=Math.max(0,Math.min(n-1,i));
 const tr=document.getElementById("rtrack");if(!tr)return;
 tr.style.transform=`translateX(${-routineIdx*100}%)`;
 const ov=tr.closest(".rovl");
 ov.querySelector(".ttl").textContent=`Étape ${routineIdx+1} / ${n}`;
 ov.querySelector(".rprog>i").style.width=Math.round((routineIdx+1)/n*100)+"%";
 ov.querySelectorAll(".rnav button")[0].disabled=routineIdx===0;
 ov.querySelectorAll(".rnav button")[1].disabled=routineIdx===n-1;
 ov.querySelectorAll(".rdots .d").forEach((d,k)=>d.classList.toggle("on",k===routineIdx));
 const sl=ov.querySelectorAll(".rslide")[routineIdx];if(sl)sl.scrollTop=0;

  const {week,session}=f, st=statusOf(session.id), blk=blockForWeek(week);

  const mz=mainZone(session);

  const ppgHead=exs.length?(()=>{const c=ppgCircuitFor(session);return `<div class="card" style="padding:12px 14px"><div style="font-size:14px;font-weight:800;margin-bottom:4px">Format circuit</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.5"><strong>${c.tours} tours</strong> de la liste · récup ${esc(c.rest)} entre les tours. Doses indiquées <strong>par tour</strong>.</div><div style="font-size:12px;color:var(--text-disabled);line-height:1.45;margin-top:6px">${esc(c.note)}</div></div>`;})():"";
  return `<div class="ovl">
    <div class="ohead">
      <div class="oback" data-act="closeDetail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></div>
