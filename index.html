      <div class="o-facts">
        <span class="o-pill" style="color:#fff">${icon(SPORT_META[session.sport].icon)}${SLBL[session.sport]||""}</span>
        <span class="o-pill"><span class="num">${fmtMin(session.minutes)}</span></span>
        <span class="o-pill">${esc(TYPE_LABELS[session.type]||"Séance")}</span>
        ${sPill}
      </div>
    </div>
    <div style="padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px">
      ${flashCard()}
      ${session.adjMotif?`<div class="adjnote"><b>${session.dropped?"Retirée du plan":"Ajustée par le plan"}</b>${esc(session.adjMotif)}${session.adjOp&&!S.adj.find(o=>o.id===session.adjOp&&o.kind==="weekReduce")?`<div style="margin-top:10px"><button class="cta ghost sm" data-act="undo" data-arg="${session.adjOp}">${session.dropped?"Remettre la séance":"Annuler l'ajustement"}</button></div>`:""}</div>`:""}
      ${session.dropped?"":`<div class="o-note">${intention}</div>`}
      ${session.sport==="natation"?`<button class="rt-open" data-act="openRoutine"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg></span><span class="tx"><h4>Échauffement</h4><p>Routine mobilité + activation · ${ROUTINE_NATATION.length} étapes</p></span><span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span></button>`:""}
      ${obj?`<div class="card"><div style="font-size:14px;font-weight:800;margin-bottom:5px">Objectif</div><div style="font-size:14px;color:var(--text-secondary);line-height:1.5">${esc(obj.desc)}</div>${tgMain?`<div class="tgt">${esc(tgMain)}</div>`:""}</div>`:""}

        ${(st==="done"||st==="z2")?effortBlock(session):`<button class="cta ghost imp-btn" data-act="sheetOpen" data-arg="imprevu">Imprévu</button>`}
        ${dayPicker(session,cur)}
        ${st?`<button class="cta ghost" style="width:100%;margin-top:10px" data-act="st" data-arg="">Réinitialiser le statut</button>`:""}
      </div>`}

<script>
"use strict";
/* ════════════ Rendu ════════════ */
const SCREENS={overview:screenOverview,calendar:screenCalendar,bilan:screenBilan,settings:screenSettings,ppg:screenPPG};
function confirmModal(){
  const c=S.confirm||{};
  return `<div class="modal-back"><div class="modal">
    <div class="modal-t">Confirmation</div>
    <div class="modal-m">${esc(c.msg||"Confirmer ?")}</div>
    <div class="modal-row">
      <button class="btn secondary" data-act="confirmNo">Annuler</button>
      <button class="btn" style="background:var(--danger);color:#fff;border-color:var(--danger)" data-act="confirmYes">Réinitialiser</button>
    </div>
  </div></div>`;
}
function render(){
  const fn=SCREENS[S.view]||screenOverview;
  document.getElementById("app").innerHTML=fn();
  const ov=document.querySelector(".ovl"), keep=ov&&S.detailId===render._last?ov.scrollTop:0; render._last=S.detailId;
  document.getElementById("overlay").innerHTML=S.confirm?confirmModal():((S.detailId?overlayDetail():"")+(S.detailId&&S.sheet?imprevuSheet():"")+(S.routineOpen?overlayRoutine():""));
  const ov2=document.querySelector(".ovl"); if(ov2&&keep)ov2.scrollTop=keep;
  document.getElementById("navwrap").classList.toggle("hidden",!!S.detailId||!!S.confirm);
  const navMap={ppg:"settings"};
  const active=navMap[S.view]||S.view;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===active));
  window.scrollTo({top:0});
  if(S.dataReady)ensureNext();
}

/* ════════════ Actions ════════════ */

const ACTIONS={
  open:a=>{S.detailId=a;render();},
  closeDetail:()=>{S.detailId=null;S.sheet=null;S.flash=null;render();},
  flashClose:()=>{S.flash=null;render();},
  sheetOpen:a=>{S.sheet=a;render();},
  sheetClose:()=>{S.sheet=null;render();},
  impMissed:()=>{imprevuMissed(S.detailId);S.sheet=null;render();},
  impShort:()=>{imprevuShort(S.detailId);S.sheet=null;render();},
  away:a=>{imprevuAway(Number(a));S.sheet=null;S.detailId=null;S.view="calendar";S.calendarMode="Semaine";render();},
  pause:a=>{startPause(a);S.view="overview";render();},
  endPause:()=>{endPause();render();},
  rpe:a=>{S.rpe[S.detailId]=Number(a);persist();checkEffortDrift();render();},
  undo:a=>{undoOp(a);S.flash="Ajustement annulé.";render();},
  validateBilan:()=>{validateBilan();render();},
  openRoutine:()=>{routineIdx=0;S.routineOpen=true;render();},
  closeRoutine:()=>{S.routineOpen=false;render();},
  routineNav:a=>{routineGo(routineIdx+(a==="next"?1:-1));},
  routineDot:a=>{routineGo(Number(a));},
  st:a=>{setStatus(S.detailId,a);},
  setDay:a=>{setDay(S.detailId,Number(a));},
  toSuivi:()=>{const el=document.getElementById("suivi-data");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},
  go:a=>{S.flash=null;if(a==="calendar-liste"){S.view="calendar";S.calendarMode="Liste";}else S.view=a;render();},
  week:a=>{S.currentWeek=Number(a);persist();render();},
  "week-go":a=>{S.currentWeek=Number(a);S.calendarMode="Semaine";persist();render();},
  calmode:a=>{S.calendarMode=a;render();},
  saveZones:()=>{S.fcMax=(document.getElementById("fFcMax")||{}).value||"";
    S.pace=(document.getElementById("fPace")||{}).value||"";
    S.ftp=(document.getElementById("fFtp")||{}).value||"";persist();render();},
  saveRace:()=>{S.raceName=(document.getElementById("fRace")||{}).value||"";
    S.raceDate=(document.getElementById("fRaceDate")||{}).value||"";persist();render();},
  resetTracking:()=>{S.confirm={kind:"tracking",msg:"Réinitialiser le suivi ? Statuts, déplacements, efforts ressentis, ajustements et bilans seront effacés."};render();},
  resetProgram:()=>{S.confirm={kind:"program",msg:"Remettre à zéro le programme complet ? Statuts, déplacements, zones et course cible seront effacés."};render();},
  confirmNo:()=>{S.confirm=null;render();},
  confirmYes:()=>{const k=S.confirm&&S.confirm.kind;S.confirm=null;S.status={};S.moves={};S.adj=[];S.rpe={};S.pause=null;S.bilanDone={};if(k==="program"){S.fcMax=S.pace=S.ftp=S.raceName=S.raceDate="";}persist();render();}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const fn=ACTIONS[el.dataset.act];
  if(fn){e.preventDefault();fn(el.dataset.arg);}
});
document.addEventListener("change",e=>{
});
/* Carrousel routine : swipe tactile + clavier */
let _rsx=null,_rsy=null;
document.addEventListener("touchstart",e=>{if(!S.routineOpen||!e.target.closest(".rvp"))return;_rsx=e.touches[0].clientX;_rsy=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(!S.routineOpen||_rsx===null)return;
  const dx=e.changedTouches[0].clientX-_rsx,dy=e.changedTouches[0].clientY-_rsy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))routineGo(routineIdx+(dx<0?1:-1));
  _rsx=_rsy=null;
});
document.addEventListener("keydown",e=>{
  if(!S.routineOpen)return;
  if(e.key==="ArrowRight")routineGo(routineIdx+1);
  else if(e.key==="ArrowLeft")routineGo(routineIdx-1);
  else if(e.key==="Escape"){S.routineOpen=false;render();}
});
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");
  if(b){S.view=b.dataset.v;S.detailId=null;S.sheet=null;S.flash=null;render();}
});

/* ════════════ Données ════════════ */
const READ_TOKEN='0q}"9Mux460l';  // variable d'environnement READ_TOKEN (Netlify)
function q(u){return READ_TOKEN?u+"?token="+encodeURIComponent(READ_TOKEN):u;}
async function grab(u){try{const r=await fetch(q(u),{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(_){return null;}}
async function loadData(){
  const [w,c]=await Promise.all([grab("/api/wellness"),grab("/api/load")]);
  S.wellness=w; S.charge=c; S.dataReady=true; recordHistory(); render();
}
function boot(){
  document.querySelectorAll("#nav button[data-ic]").forEach(b=>{b.innerHTML=icon(b.dataset.ic);});
  render();
  loadData();
  fetch("/api/intervals-sync",{cache:"no-store"})
    .then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ok)loadData();}).catch(()=>{});
  setInterval(loadData,30*60*1000);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>
